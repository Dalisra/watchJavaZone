# Test-Driven Development for lib-pcb

## When to Use This

Use TDD when:

- **Fixing bugs**: Write tests that demonstrate the bug first, then fix to make tests pass
- **Adding new features**: Specify behavior through tests before implementing
- **Refactoring**: Ensure existing behavior is preserved with comprehensive test coverage
- **Edge cases**: Document and prevent regressions for complex scenarios

You're in the right place if:
- You want to ensure bugs stay fixed (regression prevention)
- You need confidence that changes don't break existing functionality
- You want tests to serve as living documentation
- You're implementing complex logic with many edge cases

## Quick Start

### Step 0: Create TDD Plan Document (if needed)

For complex features, create a TDD plan document **in the correct location**:

**✅ Correct:**
```
docs/implementation/gerber/Documentation-Layer-Separation.md  # Gerber feature
docs/implementation/altium/Track-Parser-Implementation.md     # Altium feature
docs/implementation/validators/Impedance-Validator-TDD.md     # Validator feature
```

**❌ Wrong:**
```
TDD-DOCUMENTATION-LAYERS.md        # ❌ Don't create in project root!
TDD-PLAN.md                        # ❌ Don't create in project root!
```

**Rule:** Always use `docs/implementation/{category}/` for TDD plans and implementation docs.
See the **docs-organization** skill for complete documentation hierarchy.

### TDD Cycle (Red-Green-Refactor)

1. **RED**: Write a failing test that demonstrates the bug or specifies new behavior
2. **GREEN**: Write minimal code to make the test pass
3. **REFACTOR**: Improve code while keeping tests green

**Example from Bug #206 (Invalid Bounding Box):**

```java
// Step 1: RED - Write test that demonstrates bug
@Test
void shouldNotIncludeOriginWhenFirstLayerEmpty() {
    Layer emptyLayer = new Layer(1961, "Silkscreen");  // No features
    Layer copperLayer = createLayerWithFeatures(2200, "Copper",
                                                100_000_000, 50_000_000,
                                                175_000_000, 100_000_000);

    PCBDesign design = PCBDesign.builder()
            .layers(List.of(emptyLayer, copperLayer))  // Empty layer FIRST
            .build();

    BoundBox box = design.getBoundBox();

    // BUG: Currently fails - west is 0 instead of 100mm
    assertNotEquals(0, box.west(), "Should not include origin when no features at origin");
    assertEquals(99_999_999, box.west(), "Should be from copper layer only");
}

// Test FAILS initially (demonstrates bug exists)

// Step 2: GREEN - Fix implementation
private void calculateBoundBox() {
    // Find first non-empty layer (skip empty layers)
    BoundBox result = null;
    for (Layer layer : layers) {
        BoundBox layerBounds = layer.getBoundBox();
        if (isEmptyBoundBox(layerBounds)) continue;  // FIX: Skip empty layers

        result = (result == null) ? layerBounds : result.union(layerBounds);
    }
    boundBox = (result != null) ? result : BoundBox.empty();
}

// Test PASSES now

// Step 3: REFACTOR - Extract helper method
private boolean isEmptyBoundBox(BoundBox box) {
    return box.west() == 0 && box.east() == 0 &&
           box.south() == 0 && box.north() == 0;
}

// Tests still PASS
```

## Overview

TDD is a software development approach where **tests are written before implementation code**. This ensures:

**Benefits:**
- Bug fixes stay fixed (regression prevention)
- Tests document expected behavior
- High confidence in refactoring
- Edge cases are explicitly tested
- Design emerges from requirements

**What's Covered:**
- TDD cycle: Red → Green → Refactor
- Writing comprehensive test suites (Bug #206: 14 tests)
- Test organization patterns (nested test classes)
- Regression prevention strategies
- Real-world example: Invalid bounding box fix

**What's Not Covered:**
- Unit testing basics (see qa-testing skill)
- Test quality best practices (see qa-test-quality skill)
- General debugging strategies

**Key Insight:**
Tests written first serve dual purposes: they demonstrate bugs exist AND specify correct behavior. When the test passes, you know the bug is fixed AND the fix is verified.

## Core Concepts

### The TDD Cycle

```
1. RED: Write failing test
   ↓
2. GREEN: Make test pass (minimal code)
   ↓
3. REFACTOR: Improve code
   ↓
4. Repeat
```

**RED (Write Failing Test):**
- Test demonstrates bug or specifies new behavior
- Test should fail initially (proves test is valid)
- Focus on WHAT behavior is expected, not HOW it's implemented

**GREEN (Make Test Pass):**
- Write simplest code to make test pass
- Don't optimize yet - just make it work
- One failing test at a time

**REFACTOR (Improve Code):**
- Clean up implementation while keeping tests green
- Extract methods, rename variables, remove duplication
- Run tests frequently to ensure nothing breaks

### Test Organization Patterns

Use **nested test classes** to organize related scenarios:

```java
@DisplayName("PCBDesign Bounding Box Calculation")
class PCBDesignBoundingBoxTest {

    @Nested
    @DisplayName("Basic Scenarios")
    class BasicScenarios {
        @Test void singleLayer() { }
        @Test void multipleLayers() { }
        @Test void noLayers() { }
    }

    @Nested
    @DisplayName("Empty Layer Scenarios (Bug #206)")
    class EmptyLayerScenarios {
        @Test void firstLayerEmpty() { }
        @Test void multipleEmptyBeforeNonEmpty() { }
        @Test void emptyInMiddle() { }
        @Test void emptyAtEnd() { }
        @Test void allLayersEmpty() { }
    }

    @Nested
    @DisplayName("Real-World Scenarios")
    class RealWorldScenarios {
        @Test void typical4LayerBoard() { }
        @Test void germanPackageFromIssue204() { }
        @Test void boardNotAtOrigin() { }
    }

    @Nested
    @DisplayName("Validation Scenarios")
    class ValidationScenarios {
        @Test void validCoordinates() { }
        @Test void positiveDimensions() { }
    }
}
```

**Benefits:**
- Clear organization by scenario type
- Easy to find related tests
- Good test report output
- Documents different use cases

## Case Study: Bug #206 - Invalid Bounding Box

### Problem

Gerber converter successfully extracted copper layers but set invalid bounding box on PCBDesign, causing black thumbnails and empty 2D views.

**Root Cause:** Empty layers (no features) return `BoundBox.empty()` = `(0,0,0,0)`. When this is unioned with actual layer bounds, the origin point gets included incorrectly.

### TDD Approach

**Step 1: Write Comprehensive Tests**

Created `PCBDesignBoundingBoxTest.java` with 14 tests:

| Category | Tests | Purpose |
|----------|-------|---------|
| Basic Scenarios | 3 | Verify normal operation |
| Empty Layer Scenarios | 5 | Demonstrate Bug #206 |
| Real-World Scenarios | 3 | Test actual use cases |
| Validation Scenarios | 3 | Ensure correctness |

**Initial Results:**
- ✅ 10 tests pass (normal scenarios work)
- ❌ 4 tests fail (empty layer bug demonstrated)

**Step 2: Fix Implementation**

Before (broken):
```java
private void calculateBoundBox() {
    if (layers.isEmpty()) {
        boundBox = BoundBox.empty();
        return;
    }

    // BUG: Starts with first layer even if empty
    BoundBox result = layers.get(0).getBoundBox();
    for (int i = 1; i < layers.size(); i++) {
        result = result.union(layers.get(i).getBoundBox());
    }
    boundBox = result;
}
```

After (fixed):
```java
private void calculateBoundBox() {
    if (layers.isEmpty()) {
        boundBox = BoundBox.empty();
        return;
    }

    // Find first non-empty layer to initialize
    BoundBox result = null;
    for (Layer layer : layers) {
        BoundBox layerBounds = layer.getBoundBox();

        // Skip empty layers (prevents origin pollution)
        if (isEmptyBoundBox(layerBounds)) {
            continue;
        }

        if (result == null) {
            result = layerBounds;  // First non-empty layer
        } else {
            result = result.union(layerBounds);  // Union with others
        }
    }

    // All layers empty → return empty box
    boundBox = (result != null) ? result : BoundBox.empty();
}

private boolean isEmptyBoundBox(BoundBox box) {
    return box.west() == 0 && box.east() == 0 &&
           box.south() == 0 && box.north() == 0;
}
```

**Step 3: Verify Fix**

Final Results:
- ✅ **14 tests pass** (all scenarios)
- ✅ **698 total tests pass** (no regressions)

## Case Study 2: Layer Bug - Feature Bounding Box (Proactive Discovery)

### Problem

During proactive bug hunt (Task #28), found Layer.calculateBoundBox() had same pattern as Bug #206 but at different abstraction level.

**Root Cause:** Layer initialized bounding box from first feature without checking if empty. When first feature is empty (text label, zero-size element), origin `(0,0,0,0)` pollutes layer bounds.

**Discovery Method:** Systematic search using sequential-init-bugs skill patterns found this before it hit production.

### TDD Approach

**Step 1: Write Comprehensive Tests**

Added nested test class to existing `LayerTest.java`:

```java
@Nested
@DisplayName("Empty Feature Bounding Box Scenarios - Bug Prevention")
class EmptyFeatureBoundingBoxScenarios {
    // 6 comprehensive tests
}
```

| Category | Tests | Purpose |
|----------|-------|---------|
| Main regression test | 1 | shouldNotIncludeOriginWhenFirstFeatureEmpty |
| Multiple empty scenarios | 3 | Empty features before/in middle/at end |
| Edge cases | 2 | All empty, multiple valid (baseline) |

**Initial Results (RED):**
- ✅ 2 tests pass (baseline scenarios)
- ❌ 4 tests fail (empty feature bug demonstrated)
- Error: "expected: <25000000> but was: <0>" (origin pollution confirmed)

**Step 2: Fix Implementation**

Before (broken):
```java
private void calculateBoundBox() {
    List<Feature> allFeatures = getFeatures();
    if (allFeatures.isEmpty()) {
        boundBox = BoundBox.empty();
        return;
    }

    // BUG: Starts with first feature even if empty
    BoundBox result = allFeatures.get(0).getBoundBox();
    for (int i = 1; i < allFeatures.size(); i++) {
        result = result.union(allFeatures.get(i).getBoundBox());
    }
    boundBox = result;
}
```

After (fixed):
```java
private void calculateBoundBox() {
    List<Feature> allFeatures = getFeatures();
    if (allFeatures.isEmpty()) {
        boundBox = BoundBox.empty();
        return;
    }

    // Find first non-empty feature to initialize
    BoundBox result = null;
    for (Feature feature : allFeatures) {
        BoundBox featureBounds = feature.getBoundBox();

        // Skip empty features (prevents origin pollution)
        if (isEmptyBoundBox(featureBounds)) {
            continue;
        }

        if (result == null) {
            result = featureBounds;  // First non-empty feature
        } else {
            result = result.union(featureBounds);  // Union with others
        }
    }

    // All features empty → return empty box
    boundBox = (result != null) ? result : BoundBox.empty();
}

private boolean isEmptyBoundBox(BoundBox box) {
    return box.west() == 0 && box.east() == 0 &&
           box.south() == 0 && box.north() == 0;
}
```

**Step 3: Verify Fix (GREEN)**

Final Results:
- ✅ **6 new tests pass** (all empty feature scenarios)
- ✅ **65 total Layer tests pass** (no regressions)
- ✅ **9924 total tests pass** (complete suite)

### Key Differences from Bug #206

**Similarities:**
- Identical bug pattern (sequential initialization)
- Same fix approach (skip empty, init from first valid)
- Same TDD process (RED → GREEN → VERIFY)

**Differences:**
- **Discovery:** Proactive hunt vs production issue
- **Abstraction:** Feature level vs layer level
- **Fix Time:** 30 minutes vs 1.5 hours (pattern known)
- **Tests:** 6 vs 14 (narrower scope)

### Learnings

**Pattern Recognition Works:**
- Bug #206 pattern enabled finding Layer bug
- sequential-init-bugs skill made search systematic
- Proactive hunting prevents production issues

**TDD Accelerates Fixes:**
- Tests prove bug exists
- Tests guide implementation
- Tests prevent regression
- Faster when pattern is known

**Related:** See proactive-bug-hunting skill for systematic search process

## Writing Effective TDD Tests

### 1. Test One Thing

Each test should verify a single behavior:

```java
// ❌ BAD: Tests multiple things
@Test
void testBoundingBox() {
    assertEquals(expected, design.getBoundBox().west());
    assertEquals(expected, design.getBoundBox().north());
    assertTrue(design.getBoundBox().width() > 0);
    assertNotNull(design.getLayers());
}

// ✅ GOOD: Tests one thing
@Test
void shouldCalculateWestEdgeFromFeatures() {
    assertEquals(expected, design.getBoundBox().west());
}

@Test
void shouldHavePositiveWidth() {
    assertTrue(design.getBoundBox().width() > 0);
}
```

### 2. Use Descriptive Names

Test names should describe the scenario and expected behavior:

```java
// ❌ BAD: Generic name
@Test
void testBoundBox() { }

// ✅ GOOD: Descriptive name
@Test
void shouldNotIncludeOriginWhenFirstLayerEmpty() { }

@Test
void shouldCalculateBoundsForTypical4LayerBoard() { }

@Test
void shouldHandleMultipleEmptyLayersBeforeNonEmpty() { }
```

### 3. Follow AAA Pattern

Arrange → Act → Assert:

```java
@Test
void shouldUnionMultipleLayerBounds() {
    // Arrange
    Layer layer1 = createLayerWithFeatures(2200, "Top", 10mm, 10mm, 20mm, 20mm);
    Layer layer2 = createLayerWithFeatures(2231, "Bottom", 5mm, 5mm, 15mm, 15mm);
    PCBDesign design = PCBDesign.builder().layers(List.of(layer1, layer2)).build();

    // Act
    BoundBox boundBox = design.getBoundBox();

    // Assert
    assertEquals(4_999_999, boundBox.west(), "West should be minimum of both layers");
    assertEquals(20_000_001, boundBox.north(), "North should be maximum of both layers");
}
```

### 4. Test Edge Cases

Don't just test happy path - test boundaries and error conditions:

```java
// Happy path
@Test void singleLayerWithFeatures() { }
@Test void multipleLayersWithFeatures() { }

// Edge cases
@Test void noLayers() { }
@Test void allLayersEmpty() { }
@Test void firstLayerEmpty() { }
@Test void emptyLayerInMiddle() { }
@Test void boardNotAtOrigin() { }
```

### 5. Use Helper Methods

Extract common setup into helper methods:

```java
private Layer createLayerWithFeatures(int layerId, String name,
                                      long minX, long minY,
                                      long maxX, long maxY) {
    Layer layer = new Layer(layerId, name);

    // Create shape
    Shape circle = new BasicShape(1, "circle", BasicShape.Variant.CIRCLE, 100_000, 100_000);
    layer.addShape(circle);

    // Create features at corners to define bounding box
    Point bottomLeft = new Point((int) minX, (int) minY);
    Point topRight = new Point((int) maxX, (int) maxY);
    // ... create features ...

    return layer;
}

// Use in tests
@Test
void shouldCalculateBounds() {
    Layer layer = createLayerWithFeatures(2200, "Copper", 0, 0, 100mm, 80mm);
    // ... test logic ...
}
```

## Regression Prevention

### Document Known Issues

Use test names and comments to reference issues:

```java
@Nested
@DisplayName("Empty Layer Scenarios (Bug #206)")
class EmptyLayerScenarios {

    @Test
    @DisplayName("BUG #206: Should not include origin when first layer is empty")
    void shouldNotIncludeOriginWhenFirstLayerEmpty() {
        // Previously failed because empty layer (0,0,0,0) polluted union
        // See: https://github.com/exoreaction/lib-pcb/issues/206

        Layer emptyLayer = new Layer(1961, "Silkscreen");
        Layer copperLayer = createLayerWithFeatures(...);

        PCBDesign design = PCBDesign.builder()
                .layers(List.of(emptyLayer, copperLayer))
                .build();

        BoundBox box = design.getBoundBox();

        assertNotEquals(0, box.west(), "Bug #206: Should not include origin");
    }
}
```

### Test Real-World Scenarios

Include tests based on actual production data:

```java
@Test
@DisplayName("Should calculate bounds for German package from Issue #204")
void shouldCalculateBoundsForGermanPackage() {
    // Simulate actual file: LP-Daten 1430.2084 Stand 02.12.2025.zip
    // Board dimensions: 174.9mm × 96.6mm
    // 6 copper layers + 2 empty documentation layers

    Layer l2 = createLayerWithFeatures(2200, "L2", 0, 0, 174_942_501, 96_647_000);
    Layer l3 = createLayerWithFeatures(2201, "L3", 1mm, 1mm, 173_942_501, 95_647_000);
    // ... other layers ...
    Layer drill = new Layer(616, "Drill");  // Empty
    Layer outline = new Layer(2600, "Outline");  // Empty

    PCBDesign design = PCBDesign.builder()
            .layers(List.of(l2, l3, l4, l5, adb, adt, drill, outline))
            .build();

    BoundBox box = design.getBoundBox();

    // Should match actual board dimensions (with pad expansion)
    assertEquals(-1, box.west());
    assertEquals(96_647_001, box.north());
    assertEquals(174_942_502, box.east());
}
```

## Common Patterns

### Pattern 1: Test Invariants

Verify properties that should always hold:

```java
@Test
void boundingBoxShouldHaveValidCoordinates() {
    PCBDesign design = createDesignWithLayers(...);
    BoundBox box = design.getBoundBox();

    // Invariants
    assertTrue(box.west() <= box.east(), "West <= East");
    assertTrue(box.south() <= box.north(), "South <= North");
    assertTrue(box.width() >= 0, "Non-negative width");
    assertTrue(box.height() >= 0, "Non-negative height");
}
```

### Pattern 2: Parameterized Tests

Test same logic with different inputs:

```java
@ParameterizedTest
@CsvSource({
    "0, 0, 100000000, 80000000",      // Board at origin
    "50000000, 50000000, 150000000, 130000000",  // Offset board
    "10000000, 10000000, 20000000, 20000000"     // Small board
})
void shouldCalculateBoundsForVariousBoards(long minX, long minY, long maxX, long maxY) {
    Layer layer = createLayerWithFeatures(2200, "Copper", minX, minY, maxX, maxY);
    PCBDesign design = PCBDesign.builder().layers(List.of(layer)).build();

    BoundBox box = design.getBoundBox();

    assertEquals(minX - 1, box.west(), "West with pad expansion");
    assertEquals(maxY + 1, box.north(), "North with pad expansion");
}
```

### Pattern 3: Test Boundaries

Test at the edges of valid ranges:

```java
@Test
void shouldHandleEmptyBoundingBox() {
    PCBDesign design = PCBDesign.builder().layers(List.of()).build();
    BoundBox box = design.getBoundBox();
    assertEquals(BoundBox.empty(), box);
}

@Test
void shouldHandleSinglePoint() {
    Layer layer = createLayerWithFeatures(2200, "Copper", 0, 0, 0, 0);
    BoundBox box = layer.getBoundBox();
    assertEquals(-1, box.west());
    assertEquals(1, box.east());
}

@Test
void shouldHandleLargeBoard() {
    // Test maximum reasonable board size
    Layer layer = createLayerWithFeatures(2200, "Copper",
                                         0, 0,
                                         1_000_000_000, 1_000_000_000);  // 1 meter
    BoundBox box = layer.getBoundBox();
    assertNotNull(box);
}
```

## TDD Best Practices

### 1. Write Test First

Don't write implementation until test exists and fails:

```java
// Step 1: Write test (it will fail)
@Test
void shouldSkipEmptyLayers() {
    // Test code here
}

// Step 2: Run test - should FAIL
// Output: "AssertionFailedError: expected: <100000000> but was: <0>"

// Step 3: Write minimal code to pass
private void calculateBoundBox() {
    // Implementation here
}

// Step 4: Run test - should PASS
```

### 2. One Failing Test at a Time

Focus on making one test pass before writing the next:

```java
// ❌ BAD: Write all 14 tests at once, then try to fix all failures
@Test void test1() { }  // FAIL
@Test void test2() { }  // FAIL
@Test void test3() { }  // FAIL
// ... overwhelmed by 14 failures

// ✅ GOOD: Write one test, make it pass, repeat
@Test void test1() { }  // FAIL → write code → PASS
@Test void test2() { }  // FAIL → write code → PASS
@Test void test3() { }  // FAIL → write code → PASS
```

### 3. Keep Tests Independent

Each test should run independently - no shared mutable state:

```java
// ❌ BAD: Shared mutable state
class MyTest {
    private PCBDesign design;  // Shared state

    @BeforeEach
    void setUp() {
        design = createDesign();
    }

    @Test
    void test1() {
        design.addLayer(...);  // Mutates shared state
    }

    @Test
    void test2() {
        // Depends on test1 not running first
    }
}

// ✅ GOOD: Independent tests
class MyTest {
    @Test
    void test1() {
        PCBDesign design = createDesign();  // Local state
        design.addLayer(...);
    }

    @Test
    void test2() {
        PCBDesign design = createDesign();  // Independent
    }
}
```

### 4. Run Full Test Suite Frequently

After each change, run ALL tests to catch regressions:

```bash
# After each code change
mvn test

# Check results
# Tests run: 698, Failures: 0  ✅
```

### 5. Refactor with Confidence

Once tests pass, improve code without fear:

```java
// Tests pass ✅

// Refactor: Extract method
private boolean isEmptyBoundBox(BoundBox box) {
    return box.west() == 0 && box.east() == 0 &&
           box.south() == 0 && box.north() == 0;
}

// Run tests again
mvn test
// Tests still pass ✅ - refactoring successful
```

## Debugging Failed Tests

### Read the Failure Message

JUnit provides detailed failure messages:

```
AssertionFailedError: West should not be 0 when no features at origin (Bug #206)
Expected: not equal but was: <0>

  at PCBDesignBoundingBoxTest.shouldNotIncludeOriginWhenFirstLayerEmpty(line 143)
```

**What this tells you:**
- Test name: `shouldNotIncludeOriginWhenFirstLayerEmpty`
- Custom message: "West should not be 0 when no features at origin (Bug #206)"
- Actual value: 0
- Line number: 143

### Add Debug Output

Temporarily add logging to understand what's happening:

```java
@Test
void shouldNotIncludeOriginWhenFirstLayerEmpty() {
    Layer emptyLayer = new Layer(1961, "Silkscreen");
    Layer copperLayer = createLayerWithFeatures(...);

    PCBDesign design = PCBDesign.builder()
            .layers(List.of(emptyLayer, copperLayer))
            .build();

    BoundBox box = design.getBoundBox();

    // Debug output
    System.out.println("Empty layer bounds: " + emptyLayer.getBoundBox());
    System.out.println("Copper layer bounds: " + copperLayer.getBoundBox());
    System.out.println("Design bounds: " + box);

    assertNotEquals(0, box.west());
}
```

**Advanced Diagnostic Pattern** - Print all layers to understand complex calculations:

```java
@Test
void shouldCalculateBoundingBoxCorrectly() throws IOException {
    PCBDesign design = loadProblemBoard();

    // DIAGNOSTIC: Print all layers to understand calculation
    System.out.println("\n=== Layer Analysis ===");
    for (Layer layer : design.getLayers()) {
        BoundBox layerBbox = layer.getBoundBox();
        double width = (layerBbox.east() - layerBbox.west()) / 1_000_000.0;
        double height = (layerBbox.north() - layerBbox.south()) / 1_000_000.0;

        System.out.printf("Layer %d (%s): %.1f × %.1fmm, features=%d%n",
            layer.getLayerId(), layer.getLayerName(), width, height,
            layer.getFeatures().size());
    }

    BoundBox bbox = design.getBoundBox();
    double finalWidth = (bbox.east() - bbox.west()) / 1_000_000.0;
    double finalHeight = (bbox.north() - bbox.south()) / 1_000_000.0;
    System.out.printf("Final BoundBox: %.1f × %.1fmm%n", finalWidth, finalHeight);

    // Now make assertions based on what you learned
    assertTrue(finalWidth >= 50 && finalWidth <= 60,
        "Expected width ~55mm, got " + finalWidth + "mm");
}
```

**Example output:**
```
=== Layer Analysis ===
Layer 256 (Edge.Cuts): 55.6 × 19.6mm, features=18
Layer 1920 (F.Fab): 52.0 × 18.2mm, features=97
Layer 2200 (F.Cu): 53.1 × 18.6mm, features=2713
Final BoundBox: 55.6 × 19.6mm
```

This shows layer 256 was used (board outline priority)!

**When to use diagnostic output:**
- Complex calculations with multiple steps
- Need to see which code path was taken
- Want to understand data transformation
- Debugging why a calculation is wrong

**Clean up after:** Remove or convert to proper logging once issue is understood.

### Handle Filtered Data in Assertions

**Problem:** Converters often filter input data (e.g., unsupported layers, invalid geometry). Tests that count raw input vs converted output will fail.

**Example - KiCad Graphics Layer Filtering:**

```java
// ❌ WRONG: Assumes all graphics are converted
@Test
void shouldConvertAllGraphics() {
    KiCadBoard board = parseBoard("pocketbeagle.kicad_pcb");
    PCBDesign design = converter.convertToMif(board);

    int totalLines = countLines(design);
    int expectedLines = board.getSegmentCount() + board.getGraphicLineCount() + board.getGraphicArcCount();

    assertEquals(expectedLines, totalLines);  // ❌ FAILS! 1704 expected, 1422 actual
}
```

**Root cause:** 282 graphics are on unsupported layers (Dwgs.User, Eco1.User, Eco2.User) and are intentionally filtered out.

**✅ CORRECT: Use range assertions**

```java
@Test
void shouldConvertSupportedGraphics() {
    KiCadBoard board = parseBoard("pocketbeagle.kicad_pcb");
    PCBDesign design = converter.convertToMif(board);

    int totalLines = countLines(design);

    // At minimum, all segments should be converted
    assertTrue(totalLines >= board.getSegmentCount(),
        "Should have at least all segments (" + board.getSegmentCount() + ")");

    // At maximum, segments + all graphics
    int maxExpected = board.getSegmentCount() + board.getGraphicLineCount() + board.getGraphicArcCount();
    assertTrue(totalLines <= maxExpected,
        "Should not exceed segments + all graphics (" + maxExpected + ")");

    // Add explanatory message
    System.out.println("Note: Graphics on unsupported layers (Dwgs.User, Eco*.User) filtered out");
}
```

**When to use range assertions:**
- Data filtering by layer, type, or validity
- Optional features (may or may not be present)
- Format-specific limitations (e.g., MIF doesn't support all KiCad features)
- Performance optimizations that skip redundant data

### Detect Invalid Input Data

**Problem:** Round-trip tests may compare invalid original data with valid converted data, causing false failures.

**Example - Degenerate Bounding Box:**

```java
// board_modern.mif has degenerate bounding box (0mm wide × 30mm tall)
// Round-trip produces VALID bounding box (208mm × 30mm)

@Test
void roundTripTest() {
    PCBDesign original = MifParser.parse("board_modern.mif");
    MifWriter.write(original, "roundtrip.mif");
    PCBDesign roundTrip = MifParser.parse("roundtrip.mif");

    // ❌ FAILS: Original east=0, roundTrip east=208mm (208mm difference!)
    assertEquals(original.getBoundBox(), roundTrip.getBoundBox());
}
```

**Root cause:** Original file has broken bounding box. Round-trip **fixes** the bug, not a regression!

**✅ CORRECT: Validate before comparing**

```java
@Test
void roundTripTest() {
    PCBDesign original = MifParser.parse("board_modern.mif");
    MifWriter.write(original, "roundtrip.mif");
    PCBDesign roundTrip = MifParser.parse("roundtrip.mif");

    BoundBox origBox = original.getBoundBox();
    BoundBox rtBox = roundTrip.getBoundBox();

    // Check if original bounding box is valid
    double width = Math.abs(origBox.east() - origBox.west()) / 1e6;
    double height = Math.abs(origBox.north() - origBox.south()) / 1e6;

    if (width < 1.0 || height < 1.0) {
        System.out.println("⚠ Original bounding box is degenerate (" + width + "×" + height + "mm)");
        System.out.println("Skipping comparison (round-trip fixes broken bbox)");
        return;  // Skip comparison - this is an IMPROVEMENT, not a regression
    }

    // Original is valid, so they should match
    assertEquals(origBox, rtBox, tolerance);
}
```

**Common invalid data patterns:**
- Degenerate geometry (zero width/height, zero area)
- Empty required fields (no layers, no features)
- Out-of-range values (negative dimensions, NaN, infinity)
- Inconsistent state (feature count != actual features)

**Strategy:**
1. **Detect** invalid data with validation checks
2. **Document** why data is invalid (comments in test)
3. **Skip** comparison or use different assertion
4. **Report** as improvement, not regression

### Isolate the Problem

Create minimal reproduction:

```java
@Test
void minimalRepro() {
    // Simplest case that demonstrates bug
    Layer empty = new Layer(1, "Empty");  // No features
    BoundBox emptyBounds = empty.getBoundBox();

    System.out.println("Empty layer bounds: " + emptyBounds);
    // Output: BoundBox(west=0, north=0, east=0, south=0)

    // Bug: Union with empty pollutes result
    BoundBox other = new BoundBox(100, 200, 200, 100);
    BoundBox union = emptyBounds.union(other);

    System.out.println("Union result: " + union);
    // Output: BoundBox(west=0, north=200, east=200, south=0)
    //         ^^^^^^^^                          ^^^^^^^^
    //         BUG: origin included!
}
```

