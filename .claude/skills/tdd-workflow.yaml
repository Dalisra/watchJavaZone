## Common Pitfalls

### ❌ Pitfall 1: Writing tests after implementation

```java
// BAD: Code written first, tests second
public void fixBug() {
    // Write fix code
}

@Test
void testFix() {
    // Write test after - might miss edge cases
}
```

**Fix:** Write test FIRST to demonstrate bug, then fix.

### ❌ Pitfall 2: Testing implementation details

```java
// BAD: Tests internal implementation
@Test
void shouldCallHelperMethod() {
    verify(design).calculateBoundBoxInternal();  // Brittle!
}

// GOOD: Tests behavior
@Test
void shouldReturnCorrectBounds() {
    assertEquals(expected, design.getBoundBox());  // Flexible
}
```

**Fix:** Test WHAT happens, not HOW it happens.

### ❌ Pitfall 3: Skipping edge cases

```java
// BAD: Only happy path
@Test
void shouldWork() {
    // Tests normal case only
}

// GOOD: Comprehensive coverage
@Test void normalCase() { }
@Test void emptyInput() { }
@Test void nullInput() { }
@Test void boundaryValues() { }
```

**Fix:** Think through edge cases before writing tests.

### ❌ Pitfall 4: Vague assertion messages

```java
// BAD: Generic message
assertEquals(expected, actual);

// GOOD: Specific message
assertEquals(expected, actual, "West edge should not include origin (Bug #206)");
```

**Fix:** Add descriptive messages to help debugging.

