## Decision Tree

**Should I create current/completed structure?**

```
Do you have 10+ docs in one directory?
├─ Yes → Organize now
└─ No
   ├─ Do you expect 20+ docs in 6 months?
   │  ├─ Yes → Organize now (preventative)
   │  └─ No → Wait until needed
   └─ Are people struggling to find current work?
      ├─ Yes → Organize now
      └─ No → Wait until needed
```

**Should I create FUTURE-IDEAS.md?**

```
Do you have 5+ planned-but-not-implemented features?
├─ Yes → Create FUTURE-IDEAS.md
└─ No → Keep in INDEX.md or issue tracker
```

---

## Key Takeaways

1. **Organize when you need it** - Don't over-engineer early, but don't wait until chaos
2. **current/ + completed/** - Simple, scalable, clear
3. **FUTURE-IDEAS.md** - Captures planned work without cluttering active docs
4. **Consistency > perfection** - Pick a naming pattern, stick to it
5. **INDEX.md is essential** - Central registry prevents link rot

