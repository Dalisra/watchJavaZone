## Anti-Patterns to Avoid

### ❌ Version Suffixes

```
PLAN-v1.md
PLAN-v2.md
PLAN-final.md
PLAN-final-REALLY.md
```

**Better:** Use git history for versions. Keep only current version in docs.

### ❌ Temporal Prefixes

```
2024-01-15-meeting-notes.md
2024-02-10-design-doc.md
```

**Better:** Use directories by phase/quarter. Use git commits for dates.

### ❌ Status in Filenames

```
PLAN-DRAFT.md
PLAN-IN-REVIEW.md
PLAN-APPROVED.md
```

**Better:** Use directories (`current/` vs `completed/`) or git branches.

### ❌ Deep Nesting

```
docs/2024/Q1/January/Week1/Monday/meeting-notes.md
```

**Better:** 2-3 levels max. Use INDEX.md to organize, not directory depth.

