## Migration Strategy

### Step 1: Create Structure

```bash
mkdir current completed
```

### Step 2: Identify Active Work

Move active/in-progress files to `current/`:
```bash
mv PHASE7-*.md current/
```

### Step 3: Archive Completed Work

Move finished work to `completed/`:
```bash
mv PHASE5-*.md PHASE6-*.md PHASE8-*.md completed/
```

### Step 4: Clean Up

- Remove duplicates (keep most recent)
- Fix naming inconsistencies
- Update index file with new paths

### Step 5: Update Links

Update central index (e.g., AUTO-FIX-PLAN-INDEX.md):
```markdown
- **Plan File:** [`current/PHASE7-PLAN.md`](current/PHASE7-PLAN.md)
- **Completion:** [`completed/PHASE8-COMPLETION.md`](completed/PHASE8-COMPLETION.md)
```

