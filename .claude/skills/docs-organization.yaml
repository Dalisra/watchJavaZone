## FUTURE-IDEAS.md Pattern

### Purpose

Document **planned but not yet implemented** features/work. Prevents:
- Re-discussing the same ideas repeatedly
- Forgetting good ideas
- Unclear prioritization

### Structure

```markdown
# Future {Category}

## 📋 Planned (Design Complete)
Features with detailed designs, ready for implementation.

### Feature 1
- **Description:** What it does
- **Priority:** P1/P2/P3
- **Target Phase:** When to implement
- **Status:** Design complete, awaiting resources

## 💭 Conceptual (Future Consideration)
Ideas for future consideration, pending demand.

### Feature 2
- **Description:** What it does
- **Priority:** P3
- **Rationale:** Why it might be useful
- **Complexity:** High/Medium/Low
```

### Example: docs/auto-fix/FUTURE-FIXERS.md

Documents 23 planned/conceptual auto-fixers:
- **📋 6 Planned** - Design complete, ready to implement (component clearance, fiducials, etc.)
- **💭 17 Conceptual** - Ideas pending user demand (panelization, cost optimization, etc.)

**Benefits:**
- Clear roadmap for future work
- Prioritization visible (P1/P2/P3)
- User demand tracking ("If you need this, file an issue")
- Prevents scope creep (conceptual items stay conceptual until prioritized)

