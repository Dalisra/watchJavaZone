# Documentation Organization Best Practices

Guidelines for organizing project documentation to maintain clarity and scalability as the project grows.

## When to Use This

Use this skill when:

- **Creating new documentation files**: You need to know where to place a new .md file
- **Organizing phase documentation**: You've completed a phase and need to move docs from `current/` to `completed/`
- **Directory structure decisions**: You're deciding whether to organize documentation into subdirectories
- **Documentation is cluttered**: You have 10+ files in one directory and finding things is difficult
- **Setting up new doc categories**: You're creating a new documentation area and want to start with good structure

You're in the right place if:
- You're about to create a TDD plan, implementation doc, or design document
- You're seeing too many files in `docs/auto-fix/` or similar directories
- You're asking "Should I create subdirectories for this?"
- You're completing a phase and following the phase-completion-docs checklist
- You're maintaining FUTURE-FIXERS.md or similar planning documents

## Where to Create New Documentation Files

**⚠️ NEVER create documentation files in the project root!** Always place them in the appropriate `docs/` subdirectory.

### Documentation Hierarchy

```
docs/
├── implementation/          # Implementation details and technical specs
│   ├── gerber/             # Gerber format implementation
│   ├── altium/             # Altium format implementation
│   ├── excellon/           # Excellon format implementation
│   ├── validators/         # Validator implementations
│   └── ...
│
├── development/            # Development process and planning
│   ├── issues/            # Bug tracking and issue documentation
│   ├── pull-requests/     # PR descriptions and planning
│   ├── IMPLEMENTATION-HISTORY.md
│   ├── AUTO-FIX-ROADMAP.md
│   └── PHASE*-*.md        # Phase plans and summaries
│
├── guides/                 # User guides and tutorials
│   └── ...
│
├── specifications/         # Format specifications and standards
│   └── ...
│
├── feature-stories/        # Feature narratives and case studies
│   └── ...
│
└── testing/                # Testing strategies and reports
    └── ...
```

### Decision Tree: Where Should This File Go?

**Implementation documentation** (TDD plans, implementation details, design docs):
- **Gerber-related** → `docs/implementation/gerber/`
- **Altium-related** → `docs/implementation/altium/`
- **Validator-related** → `docs/implementation/validators/`
- **Generic implementation** → `docs/implementation/`

**Issue tracking** (bug reports, investigations, GitHub issues):
- → `docs/development/issues/`
- Naming: `ISSUE-{number}-{description}.md` or `GITHUB-ISSUE-{description}.md`

**Pull request documentation** (PR descriptions, complex PR planning):
- → `docs/development/pull-requests/`
- Naming: `PR-{description}.md`

**Phase/project planning** (roadmaps, phase plans, completion summaries):
- → `docs/development/`

**User-facing guides** (how-to, tutorials, getting started):
- → `docs/guides/`

**Format specifications** (MIF format, Gerber specs, IPC standards):
- → `docs/specifications/`

**Feature narratives** (success stories, case studies):
- → `docs/feature-stories/`

**Testing documentation** (test strategies, reports):
- → `docs/testing/`

### Examples of Correct Placement

✅ **Good:**
```
docs/implementation/gerber/Documentation-Layer-Separation.md  # TDD plan for Gerber feature
docs/implementation/gerber/Assembly-Panel-Separation.md       # Implementation details
docs/development/PHASE8-COMPLETION-SUMMARY.md                 # Phase completion
docs/development/issues/ISSUE-236-BOUNDING-BOX-FIX.md        # Issue investigation
docs/development/pull-requests/PR-KICAD-COPPER.md            # PR description
docs/guides/Getting-Started.md                               # User guide
```

❌ **Bad:**
```
TDD-DOCUMENTATION-LAYERS.md                    # ❌ In project root!
ASSEMBLY-PANEL-IMPLEMENTATION.md               # ❌ In project root!
Documentation-Separation-Plan.md               # ❌ In project root!
ISSUE-236-FIX.md                              # ❌ In project root!
PR-DESCRIPTION.md                              # ❌ In project root!
```

### Common Mistakes

1. **Creating TDD plans in root** → Should be in `docs/implementation/{category}/`
2. **Creating phase plans in root** → Should be in `docs/development/`
3. **Creating implementation docs in root** → Should be in `docs/implementation/{category}/`
4. **Creating issue tracking docs in root** → Should be in `docs/development/issues/`
5. **Creating PR descriptions in root** → Should be in `docs/development/pull-requests/`

**Rule:** If you're about to create a .md file in the project root (except README.md, CHANGELOG.md, CONTRIBUTING.md), STOP and check this hierarchy first!

