## Quick Start

Most common use case - organizing phase documentation after completion:

```bash
# 1. After completing Phase N, move docs from current/ to completed/
cd docs/auto-fix
mv current/PHASEN-*.md completed/

# 2. Update INDEX file to point to new locations
# Edit AUTO-FIX-PLAN-INDEX.md to update paths

# 3. Verify links still work
grep -r "PHASEN" docs/ | grep -v ".md:"
```

Expected structure:
```
docs/auto-fix/
├── AUTO-FIX-PLAN-INDEX.md
├── FUTURE-FIXERS.md
├── current/            # Active phases only
└── completed/          # Completed phases
```

## Overview

**Problem:** As projects mature, documentation accumulates. Without organization, finding current vs historical docs becomes difficult.

**Solution:** Structured organization with clear separation of active, completed, and future work.

**Learned From:** Phase 8 completion (January 2026) - reorganized docs/auto-fix/ from 13 flat files to `current/` + `completed/` + FUTURE-FIXERS.md

---

## When to Organize Documentation

### Signs You Need Structure:

- ✅ **10+ documentation files** in a single directory
- ✅ **Multiple phases/versions** of work (Phase 1-8, versions, releases)
- ✅ **Difficulty finding current work** - "Which file is the active plan?"
- ✅ **Historical clutter** - Completed work mixed with active work
- ✅ **Scalability concerns** - "What happens when we have 20 phases?"

### Don't Organize Too Early:

- ❌ Less than 5 documentation files
- ❌ Single active phase/version
- ❌ Clear naming already makes organization obvious

**Rule of Thumb:** Organize when you catch yourself spending >2 minutes finding the right document.

---

## Recommended Structure

### Pattern: current/ + completed/

```
docs/{category}/
├── INDEX.md                         # Central index/registry
├── FUTURE-IDEAS.md                  # Planned/conceptual work (optional)
│
├── current/                         # Active/in-progress work
│   ├── active-project-1.md
│   └── active-project-2.md
│
└── completed/                       # Historical/finished work
    ├── project-1-plan.md
    ├── project-1-completion.md
    ├── project-2-plan.md
    └── project-2-completion.md
```

**Benefits:**
- Clear separation: active vs historical
- Easy navigation: `cd current/` finds active work instantly
- Scalable: doesn't get cluttered as project grows
- Preserves history: completed work still accessible

