## Naming Conventions

### Consistency Matters

**Bad (inconsistent):**
```
PHASE8-COMPLETION.md
PHASE6-COMPLETION-SUMMARY.md
PHASE5-ITERATION5-COMPLETION.md
```

**Good (consistent):**
```
PHASE5-COMPLETION-SUMMARY.md
PHASE6-COMPLETION-SUMMARY.md
PHASE8-COMPLETION-SUMMARY.md
```

### Recommended Patterns

**For Phases/Versions:**
```
PHASE{N}-{TOPIC}-PLAN.md
PHASE{N}-COMPLETION-SUMMARY.md
PHASE{N}-BATTLE-TEST-REPORT.md
PHASE{N}-GETTING-STARTED.md (optional)
```

**For Features:**
```
{FEATURE}-DESIGN.md
{FEATURE}-IMPLEMENTATION.md
{FEATURE}-TESTING.md
```

**Rule:** Pick a pattern, document it in INDEX.md, enforce during reviews.

---

## Maintenance

### During Active Development

**New phase starts:**
1. Create `current/PHASEN-{TOPIC}-PLAN.md`
2. Reference in INDEX.md under "Active Plans"

**Phase completes:**
1. Create `current/PHASEN-COMPLETION-SUMMARY.md`
2. Move all PHASEN-*.md from `current/` to `completed/`
3. Update INDEX.md links to point to `completed/`
4. Update FUTURE-IDEAS.md if relevant

### Regular Cleanup (quarterly)

1. **Check for duplicates** - Multiple docs describing same thing?
2. **Verify naming consistency** - All files follow pattern?
3. **Update INDEX.md** - Links still valid?
4. **Archive obsolete docs** - Mark as deprecated if superseded

