  ### Communication & Documentation (Pillar 1)
  | Skill | What It Does |
  |-------|-------------|
  | `tone-of-voice` | Professional tone, Scandinavian humility, conservative claims |
  | `writing-patterns` | Executive summary → details → verification |
  | `documentation-style` | JavaDoc, ADRs, "document the why not the what" |
  | `docs-organization` | current/ + completed/ + FUTURE-IDEAS.md structure |

  ### Engineering Patterns
  | Skill | What It Does |
  |-------|-------------|
  | `change-tracking` | Audit trail architecture, history and rollback |
  | `smart-file-matching` | 3-strategy file resolution for ambiguous file references |
  | `java-record-breaking-changes` | Safe Java record migration with new fields |

  ---

  ## Using the Methodology

  When working on ANY task, Claude should consider:

  1. **Which pillar applies?** (context, delegation, verification, synthesis, process, learning)
  2. **Which skill covers this?** (check the table above)
  3. **Am I following process discipline?** (no direct commits, tests pass before commit)
  4. **What should I capture as a skill?** (any lesson learned, any repeated pattern)

  Useful trigger phrases:
  - "Which pillar applies here?"
  - "What skill should I use for this?"
  - "How would SDD handle this?"
  - "Should this be a skill?"
  - "Is my CLAUDE.md following the guidelines?"

