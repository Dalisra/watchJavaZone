## Implementation Guide

### Level 1: Basic Fear-Driven Development

**Start here:**
1. **No direct commits to main** - Everything through PR
2. **Write tests before trusting AI code** - Round-trip tests for parsers
3. **Battle test with real files** - Not just synthetic examples

### Level 2: Intermediate

**Add:**
4. **Property-based testing** - Test invariants, not just examples
5. **Extreme measurement** - Log and verify all significant values
6. **Strategic model selection** - Right model for right task

### Level 3: Advanced

**Master:**
7. **Directed synthesis** - Explicit task breakdown, human control
8. **Continuous learning** - Every bug becomes a test/skill
9. **Cost optimization** - MAX subscription + efficient delegation

## Common Mistakes

### Mistake 1: Fear Without Systems = Just Anxiety

```
❌ WRONG: "I'm scared of AI, so I'll avoid using it"
✅ RIGHT: "I'm scared of AI hallucinations, so I built round-trip tests"

❌ WRONG: "I'm worried about costs, so I'll use AI minimally"
✅ RIGHT: "I'm worried about costs, so I got MAX subscription + optimize latency"
```

### Mistake 2: Trusting Tests You Didn't Write

```
❌ WRONG: "AI generated tests, they pass, ship it"
✅ RIGHT: "I write tests that would catch AI mistakes"
```

### Mistake 3: Hoping Instead of Verifying

```
❌ WRONG: "The code looks good, probably works"
✅ RIGHT: "Round-trip test passed, mathematically proven to work"
```

