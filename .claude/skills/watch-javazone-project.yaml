  ## Build & Run

  **Backend**
  ```bash
  cd backend/backend
  ./gradlew run         # Dev server (port 8080 implied)
  ./gradlew test        # Run tests
  ./gradlew build       # Build JAR
  ```

  **Frontend**
  ```bash
  cd frontend
  npm install           # First time only
  npm run dev           # Vite dev server (http://localhost:5173)
  npm run build         # Production build
  npm run lint          # ESLint
  ```

  ## Development Principles (from User Preferences)

  ### Code Style
  - **Functional, pragmatic code** - no over-engineering
  - **Minimal comments** - only on function definitions when needed
  - **Senior dev context** - deep knowledge assumed
  - **Simple > clever** - clear intent over abstraction

  ### Decision-Making Protocol
  - **For changes >10 LOC**: Discuss approach first (unless prefixed "YOLO")
  - **Ask vs hallucinate**: User knows domain, ask when uncertain
  - **Sound decisions**: Verify assumptions, flag divergence from goals

  ### Context Management
  - **At 90% context window**: Persist knowledge to skills, verify against goal alignment
  - **Alert on drift**: If user request diverges from high-level goals, flag it
  - **Test integrity**: NEVER cheat/skip/neuter tests - flag if tests seem wrong
  - **GitHub Issues**: Create for large tasks, direction changes, multi-step work
    - Issues persist beyond context windows (long-term memory)
    - Check existing issues before starting work (avoid duplication)
    - Update status to track completion/blockers
    - Use labels: `enhancement`, `architecture`, `direction-change`

  ### Git Workflow
  - **Minimal operations**: Max 3-4 git commands per task
  - **Feature branches**: For non-trivial work, avoid polluting main
  - **Use git mv**: ALWAYS for tracked files (preserves history)

  ### File Organization
  - **Zero root pollution**: No AI-generated files in project root
  - **Structured output**: Use /tmp/, target/, docs/ai-generated/ appropriately

  ## Key Domain Facts

  **sleepingpill API Response Structure** (javazone_2025):
  - `sessions[]` array with rich metadata
  - Key fields: title, abstract, suggestedKeywords, speakers (name, bio)
  - Video field contains Vimeo ID (e.g., "1115460917")
  - Filters: language, format, length
  - Primary keys: sessionId, conferenceId

  **Norwegian Context**:
  - PROJECT.md in Norwegian (javaBin = Norwegian Java User Group)
  - Target audience: Norwegian developer community
  - Multi-year video archive from JavaZone conferences

  ## Anti-Patterns to Avoid

  - **DO NOT** set up Elasticsearch (use Postgres FTS)
  - **DO NOT** build custom video hosting (embed Vimeo)
  - **DO NOT** mutate sleepingpill API data (read-only)
  - **DO NOT** create throw-away scripts (prefer Makefile)
  - **DO NOT** over-abstract (wait for 3+ use cases)

  ## When to Flag Issues

  1. **Goal divergence**: User request conflicts with core mission
  2. **Test problems**: Only way to pass is to cheat/skip
  3. **Uncertainty**: Don't know how to implement without hallucinating
  4. **Architecture decision**: Multiple valid approaches (>10 LOC)
  5. **Context threshold**: Approaching 90% of context window

  ## Next Implementation Steps (When User Ready)

  1. Create Flyway migrations (sessions, video_views, search_logs tables)
  2. Define JPA entities for sessions
  3. Build SessionRepository (Micronaut Data JDBC)
  4. Create SleepingPillClient (HTTP client to fetch data)
  5. Implement SessionController with /api/sessions/search endpoint
  6. Build React search interface + session list
  7. Integrate Vimeo player component
  8. Wire TanStack Query to fetch from backend
  9. Add view/search tracking
  10. Implement recommendations
