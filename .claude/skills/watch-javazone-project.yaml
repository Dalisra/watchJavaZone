prompt: |
  # Watch JavaZone - Project Domain Knowledge

  ## High-Level Mission (Gold Standard)

  Build a YouTube-like platform to make JavaZone conference presentations highly accessible, searchable, and discoverable for the Norwegian developer community.

  ### Core Goals (Priority Order)
  1. **Accessibility**: Make JavaZone videos easy to find and watch (currently trapped in Vimeo, hard to discover)
  2. **Search**: Full-text search across titles, abstracts, speakers, keywords
  3. **Metrics**: Track what people search for, what they watch, popular topics
  4. **Recommendations**: Suggest related videos based on content and behavior

  ### Non-Goals
  - NOT migrating videos to YouTube (ongoing discussion, separate effort)
  - NOT replacing sleepingpill API (read-only consumer)
  - NOT building custom video hosting (embed Vimeo)

  ## Architecture

  ### Technology Stack

  **Frontend**
  - React 19 + TypeScript (strict mode)
  - Vite 7.3 (fast dev, HMR)
  - TanStack Router v1 (file-based routing)
  - TanStack Query v5 (server state, caching)
  - Tailwind CSS v4 (styling)
  - ESLint (linting with React hooks rules)

  **Backend**
  - Micronaut 4.10.9 (Java 21, Gradle 8.14)
  - Netty (HTTP server)
  - Micronaut Data JDBC (ORM)
  - Flyway (migrations)
  - Reactor (reactive streams)
  - Jackson (JSON serialization)
  - HikariCP (connection pooling)

  **Database**
  - PostgreSQL (local dev, future Supabase hosting)
  - Full-Text Search (FTS) native to Postgres - NO Elasticsearch
  - Generated tsvector column for search index

  **Data Source**
  - sleepingpill.javazone.no API (read-only)
  - Example: `https://sleepingpill.javazone.no/public/allSessions/javazone_2025`

  **Video**
  - Vimeo embeds via `https://player.vimeo.com/video/{video_id}`

  ### Data Model (Planned)

  **sessions table**
  - sessionId (PK, from API)
  - conferenceId (e.g., javazone_2025)
  - title, abstract (text, FTS indexed)
  - speakers (JSON or normalized table)
  - suggestedKeywords (array/text, FTS indexed)
  - videoId (Vimeo ID)
  - language, format, length (filters)
  - searchVector (tsvector, generated column)

  **video_views table** (metrics)
  - id (PK)
  - sessionId (FK)
  - anonymousUserId (cookie/fingerprint)
  - timestamp

  **search_logs table** (metrics)
  - id (PK)
  - searchTerm (text)
  - timestamp
  - resultsCount

  ### API Design (Planned)

  **Search**
  - `GET /api/sessions/search?q={query}&language={lang}&format={format}`
  - Uses PostgreSQL `@@` operator with `to_tsquery()`
  - Returns ranked results via `ts_rank()`

  **Recommendations**
  - Content-based: Match suggestedKeywords or speakers
  - Behavioral: Trending videos (most views in 7 days)

  **Tracking**
  - `POST /api/views` - Log video view event
  - `POST /api/searches` - Log search query

  ### Search Implementation Strategy

  PostgreSQL Full-Text Search approach:
  1. Ingest data from sleepingpill API (cron job or startup hook)
  2. Upsert into sessions table
  3. Generate tsvector with weighted fields:
     - title (weight A - highest)
     - abstract (weight B)
     - speakers.name (weight B)
     - suggestedKeywords (weight C)
  4. Search via `@@ to_tsquery()` with `ts_rank()` sorting
  5. Add SQL WHERE clauses for language/format filters

