### Layer 3: Process Defense

**Goal:** Systematic reviews catch regressions before merge

#### Code Review Checklist

**For Bug Fixes:**
- [ ] Tests demonstrate bug exists (RED phase)
- [ ] Tests pass after fix (GREEN phase)
- [ ] Full test suite passes (no new regressions)
- [ ] Edge cases comprehensively tested
- [ ] Pattern documented if applicable
- [ ] Similar code reviewed for same bug

**For New Features:**
- [ ] Edge cases identified and tested
- [ ] Known bug patterns avoided
- [ ] Existing regression tests still pass
- [ ] New code follows safe patterns

**For Refactoring:**
- [ ] All existing tests still pass
- [ ] Behavior unchanged (proven by tests)
- [ ] No removal of regression tests
- [ ] Safe patterns maintained

#### Pre-Commit Validation

Run before every commit:

```bash
# All tests must pass
mvn test

# Check for common patterns (if linting available)
mvn checkstyle:check

# Review changed files
git diff --cached
```

#### Pre-PR Validation

Before creating PR:

```bash
# Full clean build
mvn clean install

# All tests pass
mvn test

# No regressions in integration tests
mvn verify

# Coverage maintained or improved
mvn jacoco:report
```

### Layer 4: Automation Defense

**Goal:** Tools enforce prevention automatically

#### Automated Testing

**CI/CD Integration:**
```yaml
# GitHub Actions example
- name: Run Tests
  run: mvn test

- name: Fail on Regression
  run: |
    if [ $? -ne 0 ]; then
      echo "Tests failed - blocking merge"
      exit 1
    fi
```

**Test Coverage Tracking:**
```bash
# Ensure coverage doesn't decrease
mvn jacoco:check
```

#### Linting Rules

**Custom Checkstyle Rules:**

```xml
<!-- Prevent sequential initialization pattern -->
<module name="RegexpSinglelineJava">
  <property name="format" value="\.get\(0\).*for.*i\s*=\s*1"/>
  <property name="message"
    value="Sequential initialization from first element - use null init pattern"/>
</module>
```

#### IDE Inspections

**IntelliJ IDEA Custom Inspection:**

Pattern: `.get(0)` followed by loop
Severity: Warning
Message: "Consider null initialization to handle empty first element"

#### Pre-commit Hooks

```bash
#!/bin/bash
# .git/hooks/pre-commit

# Run tests on changed files
mvn test -Dtest="$(git diff --cached --name-only | grep Test.java)"

# Check for bug patterns
git diff --cached | grep -E "\.get\(0\)" && \
  echo "WARNING: Sequential initialization pattern detected"
```

