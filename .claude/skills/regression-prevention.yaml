## Comprehensive Testing Strategies

### Test Categories

Organize tests into categories:

**1. Happy Path Tests**
- Normal operation
- Common use cases
- Expected inputs

**2. Edge Case Tests**
- Empty collections
- Boundary values
- Invalid inputs
- Null values

**3. Regression Tests**
- Tests for specific bugs
- Known failure modes
- Production issues

**4. Integration Tests**
- Real-world scenarios
- End-to-end flows
- Production data

### Test Coverage Goals

**Minimum Coverage:**
- Statement coverage: 80%
- Branch coverage: 70%
- Critical paths: 100%

**Focus Areas:**
- Recent bug fixes: 100%
- Core algorithms: 95%+
- Edge cases: Comprehensive
- Regressions: All covered

### Test Data Strategy

**Use Realistic Data:**
```java
// ❌ BAD: Unrealistic test data
@Test
void testCalculation() {
    List<Integer> values = List.of(1, 2, 3);
    // ...
}

// ✅ GOOD: Real-world dimensions
@Test
void shouldCalculateBoundsForTypicalBoard() {
    // 174.9mm × 96.6mm board (from real German package)
    Layer layer = createLayerWithFeatures(
        99_999_999,  // west (100mm)
        49_999_999,  // south (50mm)
        175_002_000, // east (175mm)
        100_001_000  // north (100mm)
    );
    // ...
}
```

**Test Production Scenarios:**
```java
@Test
void shouldHandleGermanPackageFromIssue204() {
    // Actual file that caused bug
    // 6 copper + 2 empty layers
    // Validates fix works for real data
}
```

## Preventing Specific Bug Classes

### Class 1: Sequential Initialization Bugs

**Pattern:** Initialize from first without validation

**Prevention:**
```java
// ❌ RISKY
Result result = items.get(0).calculate();
for (int i = 1; i < items.size(); i++) {
    result = result.merge(items.get(i).calculate());
}

// ✅ SAFE
Result result = null;
for (Item item : items) {
    Result itemResult = item.calculate();
    if (isInvalid(itemResult)) continue;
    result = (result == null) ? itemResult : result.merge(itemResult);
}
```

**Tests Required:**
- Empty collection
- Empty first element
- Multiple empty before valid
- All empty

### Class 2: First Strategy Without Fallback

**Pattern:** Try once, give up if fails

**Prevention:**
```java
// ❌ RISKY
Path file = tryStrategy1();
if (file == null) return null;

// ✅ SAFE
Path file = tryStrategy1();
if (file != null) return file;

file = tryStrategy2();
if (file != null) return file;

return tryStrategy3(); // Last resort
```

**Tests Required:**
- Each strategy succeeds alone
- Each strategy fails, next succeeds
- All strategies fail
- First strategy works (fast path)

### Class 3: Missing Null/Empty Checks

**Pattern:** Assume data is valid

**Prevention:**
```java
// ❌ RISKY
public BoundBox calculate(List<Feature> features) {
    return features.stream()
        .map(Feature::getBounds)
        .reduce(BoundBox::union)
        .get(); // Throws if empty!
}

// ✅ SAFE
public BoundBox calculate(List<Feature> features) {
    return features.stream()
        .map(Feature::getBounds)
        .filter(box -> !isEmptyBoundBox(box))
        .reduce(BoundBox::union)
        .orElse(BoundBox.empty()); // Safe default
}
```

**Tests Required:**
- Null input
- Empty collection
- Collection with nulls
- Collection with empty elements

