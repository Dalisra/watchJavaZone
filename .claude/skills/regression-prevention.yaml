# Regression Prevention

## When to Use This

Use this skill when:

- **After fixing a bug** - Ensure it never comes back
- **Before releases** - Validate no regressions introduced
- **Code reviews** - Check for regression prevention
- **Quality improvements** - Build systematic defenses

You're in the right place if:
- You want bugs to stay fixed permanently
- You're tired of the same bug returning
- You want systematic regression prevention
- You're building quality into the process

## Quick Start

**4-Layer Defense:**

1. **Test Layer** - Comprehensive test suites prevent re-introduction
2. **Pattern Layer** - Document patterns to prevent similar bugs
3. **Process Layer** - Systematic reviews catch regressions early
4. **Automation Layer** - Tools enforce prevention automatically

## Overview

**What's Regression Prevention?**

Regression prevention ensures fixed bugs stay fixed and similar bugs never appear. It's not just about testing - it's a comprehensive defense strategy.

**What's Covered:**
- Comprehensive testing strategies
- Bug pattern documentation
- Systematic review processes
- Automation and tooling
- Real-world examples from lib-pcb

**What's Not Covered:**
- Initial bug detection (see proactive-bug-hunting)
- General testing strategies (see qa-testing)
- Code quality improvements (see qa-test-quality)

**Key Insight:**
One bug fixed with comprehensive tests prevents many. Document the pattern, and prevent entire classes of bugs from ever appearing.

## The 4-Layer Defense

### Layer 1: Test Defense

**Goal:** Comprehensive test suites that prevent bug re-introduction

#### Edge Case Test Checklist

For any sequential processing code, test:

- [ ] **Empty collection** - No elements at all
- [ ] **Empty first element** - First element is invalid/empty
- [ ] **Multiple empty first** - Several empty before valid
- [ ] **Empty in middle** - Valid, empty, valid pattern
- [ ] **Empty at end** - Valid elements followed by empty
- [ ] **All empty** - Every element is empty/invalid
- [ ] **Single valid** - Only one valid element
- [ ] **Normal case** - All elements valid (baseline)

#### Test Organization

Use nested test classes for clarity:

```java
@DisplayName("Bounding Box Calculation")
class BoundingBoxCalculation {

    @Nested
    @DisplayName("Normal Scenarios")
    class NormalScenarios {
        // Basic functionality tests
    }

    @Nested
    @DisplayName("Empty Element Scenarios - Bug Prevention")
    class EmptyElementScenarios {
        @Test
        @DisplayName("REGRESSION: Should not include origin when first empty")
        void shouldNotIncludeOriginWhenFirstEmpty() {
            // Specific regression test
        }
        // More edge cases...
    }

    @Nested
    @DisplayName("Real-World Scenarios")
    class RealWorldScenarios {
        // Production use cases
    }
}
```

#### Regression Test Naming

Make regression tests obvious:

```java
// ✅ GOOD: Clear regression indicator
@Test
@DisplayName("REGRESSION #206: Should not include origin when first layer empty")
void shouldNotIncludeOriginWhenFirstLayerEmpty() { }

@Test
@DisplayName("BUG PREVENTION: Should skip empty features in union")
void shouldSkipEmptyFeaturesInUnion() { }

// ❌ BAD: Doesn't indicate this prevents regression
@Test
void testBoundingBox() { }
```

### Layer 2: Pattern Defense

**Goal:** Document bug patterns to prevent similar issues

#### Pattern Documentation

When you fix a bug:

1. **Identify the Pattern**
   - What was the root cause?
   - Is this pattern elsewhere in the code?
   - Can we generalize the pattern?

2. **Document the Pattern**
   - Create or update pattern skills
   - Add real-world examples
   - Provide detection strategies
   - Include prevention patterns

3. **Search for Similar Bugs**
   - Use automated searches
   - Review high-risk areas
   - Fix proactively

**Example: Sequential Initialization Pattern**

From lib-pcb:
- **Pattern:** Initialize from first element without validation
- **Instances:** 3 bugs found (all at different abstraction levels)
- **Skill:** sequential-init-bugs documents pattern
- **Prevention:** 48 tests prevent regression

