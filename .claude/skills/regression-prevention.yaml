## Best Practices

### Do's

**DO - Test First:**
- Write failing test (RED)
- Fix implementation (GREEN)
- Verify no regressions (VERIFY)

**DO - Document Patterns:**
- Create/update pattern skills
- Cross-reference related bugs
- Share with team

**DO - Review Systematically:**
- Use checklists
- Search for similar bugs
- Fix proactively when found

**DO - Automate:**
- CI/CD runs all tests
- Pre-commit hooks
- Linting rules for patterns

### Don'ts

**DON'T - Skip Tests:**
- Every bug needs tests
- Tests prove bug exists
- Tests prevent recurrence

**DON'T - Ignore Patterns:**
- One bug means more exist
- Document and search
- Fix proactively

**DON'T - Rush Fixes:**
- Use TDD approach
- Write comprehensive tests
- Review for similar bugs

**DON'T - Delete Regression Tests:**
- Keep forever
- Document why they exist
- Update if behavior changes intentionally

## Integration with Development

### Bug Fix Workflow

1. **Understand Bug**
   - Reproduce issue
   - Identify root cause
   - Check for pattern

2. **Write Tests (RED)**
   - Test demonstrates bug
   - Cover edge cases
   - Use realistic data

3. **Fix Implementation (GREEN)**
   - Minimal change to pass tests
   - Follow safe patterns
   - Add code comments

4. **Verify (VERIFY)**
   - All new tests pass
   - Full suite passes
   - No regressions introduced

5. **Document Pattern**
   - Update pattern skill
   - Search for similar
   - Fix proactively

6. **Review**
   - Code review with checklist
   - Verify test coverage
   - Check pattern prevention

