# Smart File Matching - .gbrjob Filename Mismatch Recovery

**Skill ID:** `smart-file-matching`
**Category:** Gerber, Package Handling, Content Analysis
**Since:** lib-pcb 0.51.2
**Last Updated:** 2026-01-29

## When to Use This

Use this skill when you need to:
- Recover from .gbrjob filename mismatches (manufacturer renamed files)
- Automatically detect layer types from Gerber X2 attributes
- Match files using numeric pattern recognition (manufacturer conventions)
- Handle packages where 0% of .gbrjob filenames match actual files
- Implement content-based file classification fallback
- Understand three-strategy file matching approach

## Overview

Intelligent file matching system that recovers from .gbrjob filename mismatches by analyzing Gerber file contents and using pattern recognition. Solves the problem where manufacturers rename files but don't update the .gbrjob file.

## Problem Statement

### Real-World Scenario

**Package:** `252294.zip`

**Original .gbrjob references:**
```json
{
  "FilesAttributes": [
    {"Path": "MultimeterBreadboarding-F_Cu.gbr", "FileFunction": "Copper,L1,Top"},
    {"Path": "MultimeterBreadboarding-B_Cu.gbr", "FileFunction": "Copper,L2,Bot"},
    ...
  ]
}
```

**Actual files in package:**
```
252294-02.gbr  ← Top copper (renamed by manufacturer)
252294-20.gbr  ← Bottom copper
252294-00.gbr  ← Top silkscreen
252294-22.gbr  ← Bottom silkscreen
...
```

**Result without smart matching:**
- .gbrjob mappings: 8 files referenced
- Actual filename matches: 0
- All files classified as UNKNOWN
- Conversion FAILS

**Result with smart matching:**
- Content analysis: Detects Gerber X2 attributes
- Pattern recognition: Matches numeric conventions
- Successful mapping: 7 layers identified
- Conversion SUCCESS

## Architecture

### Three-Strategy Approach

```
SmartFileMatcher.createSmartMapping()
    ├── Strategy 1: Content Analysis (Gerber X2 attributes)
    ├── Strategy 2: Numeric Pattern Recognition
    └── Strategy 3: Heuristic Matching (size, position)
```

### When Smart Matching Activates

```java
// Detect mismatch: < 50% of .gbrjob files match actual files
long matchCount = actualFiles.stream()
        .map(f -> f.getFileName().toString())
        .filter(name -> gbrJobMappings.keySet().stream()
                .anyMatch(gbrJobName -> gbrJobName.equalsIgnoreCase(name)))
        .count();

if (matchCount < gbrJobMappings.size() / 2.0) {
    log.warn(".gbrjob references {} files but only {} match. " +
             "Attempting smart file matching...",
             gbrJobMappings.size(), matchCount);

    Map<String, LayerType> smartMapping =
            SmartFileMatcher.createSmartMapping(gbrJobMappings, actualFiles);

    if (!smartMapping.isEmpty()) {
        log.info("Smart matching found {} file mappings", smartMapping.size());
        return smartMapping;
    }
}
```

## Strategy 1: Content Analysis

### Gerber X2 Attributes

Modern Gerber files contain `%TF.FileFunction` attributes that specify layer type:

```gerber
%TF.FileFunction,Copper,L1,Top*%
%TF.FileFunction,Soldermask,Top*%
%TF.FileFunction,Legend,Bot*%
%TF.FileFunction,Profile*%
```

### Implementation

```java
private static Optional<LayerType> detectLayerTypeFromContent(Path file) {
    try (BufferedReader reader = Files.newBufferedReader(file)) {
        String line;
        int linesRead = 0;

        // Read first 100 lines looking for layer indicators
        while ((line = reader.readLine()) != null && linesRead++ < 100) {
            line = line.trim();

            // Gerber X2 file attributes: %TF.FileFunction,<function>*%
            if (line.startsWith("%TF.FileFunction,")) {
                return parseFileFunctionAttribute(line);
            }

            // Legacy comment-based indicators
            if (line.startsWith("G04") || line.startsWith("#")) {
                Optional<LayerType> type = parseCommentForLayerType(line);
                if (type.isPresent()) {
                    return type;
                }
            }
        }
    } catch (IOException e) {
        log.debug("Failed to read file for content analysis: {}", file, e);
    }

    return Optional.empty();
}
```

### Attribute Parsing

```java
private static Optional<LayerType> parseFileFunctionAttribute(String line) {
    // Extract: %TF.FileFunction,Copper,L1,Top*%
    //          → "Copper,L1,Top"
    int start = line.indexOf(',');
    int end = line.indexOf('*');

    if (start > 0 && end > start) {
        String functionStr = line.substring(start + 1, end);
        return FileFunction.parse(functionStr);
    }

    return Optional.empty();
}
```

### Legacy Comment Parsing

```java
private static Optional<LayerType> parseCommentForLayerType(String comment) {
    String lower = comment.toLowerCase();

    // G04 #@! TF.FileFunction,Copper,L1,Top*
    // G04 Layer: Top copper*

    if (lower.contains("top") || lower.contains("front")) {
        if (lower.contains("copper") || lower.contains("signal")) {
            return Optional.of(LayerType.COPPER_TOP);
        } else if (lower.contains("silk") || lower.contains("legend")) {
            return Optional.of(LayerType.SILKSCREEN_TOP);
        } else if (lower.contains("mask") || lower.contains("solder")) {
            return Optional.of(LayerType.SOLDER_MASK_TOP);
        }
    }

    if (lower.contains("bottom") || lower.contains("back")) {
        if (lower.contains("copper") || lower.contains("signal")) {
            return Optional.of(LayerType.COPPER_BOTTOM);
        }
        // ... similar for other types
    }

    if (lower.contains("outline") || lower.contains("profile")) {
        return Optional.of(LayerType.BOARD_OUTLINE);
    }

    return Optional.empty();
}
```

## Strategy 2: Numeric Pattern Recognition

### Common Manufacturer Conventions

| Pattern | Layer Type | Examples |
|---------|------------|----------|
| `-02.gbr`, `-03.gbr` | COPPER_TOP | `252294-02.gbr`, `board-02.gbr` |
| `-20.gbr` | COPPER_BOTTOM | `252294-20.gbr` |
| `-00.gbr` | SILKSCREEN_TOP | `252294-00.gbr` |
| `-22.gbr` | SILKSCREEN_BOTTOM | `252294-22.gbr` |
| `-01.gbr` | SOLDER_MASK_TOP | `252294-01.gbr` |
| `-21.gbr` | SOLDER_MASK_BOTTOM | `252294-21.gbr` |
| `-pt.gbr` | PASTE_TOP | `252294-pt.gbr` |
| `-pb.gbr` | PASTE_BOTTOM | `252294-pb.gbr` |
| `---.gbr`, `-xb.gbr` | BOARD_OUTLINE | `252294---.gbr` |
| `--0.gbr` | DRILL_THROUGH | `252294--0.gbr` |

### Implementation

```java
private static boolean matchesNumericPattern(String filename, LayerType layerType) {
    String lower = filename.toLowerCase();

    return switch (layerType) {
        case COPPER_TOP ->
            lower.matches(".*-0[23]\\.gbr") || lower.matches(".*-f[._]cu\\.gbr");
        case COPPER_BOTTOM ->
            lower.matches(".*-20\\.gbr") || lower.matches(".*-b[._]cu\\.gbr");
        case SILKSCREEN_TOP ->
            lower.matches(".*-00\\.gbr") || lower.contains("-f.silk");
        case SILKSCREEN_BOTTOM ->
            lower.matches(".*-22\\.gbr") || lower.contains("-b.silk");
        case SOLDER_MASK_TOP ->
            lower.matches(".*-01\\.gbr") || lower.contains("-f.mask");
        case SOLDER_MASK_BOTTOM ->
            lower.matches(".*-21\\.gbr") || lower.contains("-b.mask");
        case PASTE_TOP ->
            lower.contains("-pt.gbr") || lower.contains("-f.paste");
        case PASTE_BOTTOM ->
            lower.contains("-pb.gbr") || lower.contains("-b.paste");
        case BOARD_OUTLINE ->
            lower.matches(".*---\\.gbr") || lower.matches(".*-xb\\.gbr") ||
            lower.contains("edge") || lower.contains("outline");
        case DRILL_THROUGH ->
            lower.matches(".*--0\\.gbr") || lower.contains("drill");
        default -> false;
    };
}
```

### Pattern Matching Flow

```java
private static List<Path> findByNumericPattern(List<Path> files, LayerType layerType) {
    return files.stream()
            .filter(f -> matchesNumericPattern(f.getFileName().toString(), layerType))
            .collect(Collectors.toList());
}
```

## Complete Matching Algorithm

```java
public static Map<String, LayerType> createSmartMapping(
        Map<String, LayerType> gbrJobMappings,
        List<Path> actualFiles) {

    log.debug("Attempting smart file matching for {} .gbrjob entries and {} actual files",
            gbrJobMappings.size(), actualFiles.size());

    Map<String, LayerType> smartMapping = new HashMap<>();

    // Group .gbrjob entries by LayerType
    Map<LayerType, List<String>> entriesByType = gbrJobMappings.entrySet().stream()
            .collect(Collectors.groupingBy(
                    Map.Entry::getValue,
                    Collectors.mapping(Map.Entry::getKey, Collectors.toList())
            ));

    // Analyze actual Gerber files to detect their layer types
    Map<Path, LayerType> detectedTypes = new HashMap<>();
    for (Path file : actualFiles) {
        if (isGerberFile(file)) {
            Optional<LayerType> detected = detectLayerTypeFromContent(file);
            detected.ifPresent(type -> detectedTypes.put(file, type));
        }
    }

    log.debug("Detected layer types for {} files from content analysis",
            detectedTypes.size());

    // Try to match detected types to expected types from .gbrjob
    for (Map.Entry<LayerType, List<String>> entry : entriesByType.entrySet()) {
        LayerType expectedType = entry.getKey();
        int expectedCount = entry.getValue().size();

        // Find actual files with matching detected type
        List<Path> matchingFiles = detectedTypes.entrySet().stream()
                .filter(e -> e.getValue() == expectedType)
                .map(Map.Entry::getKey)
                .collect(Collectors.toList());

        // Try numeric pattern matching if content detection didn't work
        if (matchingFiles.isEmpty()) {
            matchingFiles = findByNumericPattern(actualFiles, expectedType);
        }

        // Map the matching files
        for (int i = 0; i < Math.min(matchingFiles.size(), expectedCount); i++) {
            String filename = matchingFiles.get(i).getFileName().toString();
            smartMapping.put(filename, expectedType);
            log.info("Smart match: {} → {} (detected from content/pattern)",
                    filename, expectedType);
        }
    }

    return smartMapping;
}
```

## Integration with PackageReader

### Three-Pass Scanning

```java
private static void scanFilesInDirectory(Path root, Builder builder, int nestingDepth) {
    List<Path> allFiles = /* collect all files */;

    // Pass 1: Find and parse .gbrjob
    Optional<GbrJobFile> gbrJobData = findAndParseGbrJob(allFiles, builder);

    // Pass 1.5: Try smart matching if filenames don't match
    Map<String, LayerType> smartMapping = new HashMap<>();
    if (gbrJobData.isPresent()) {
        smartMapping = trySmartFileMatching(gbrJobData.get(), allFiles);
    }

    // Pass 2: Classify files
    for (Path file : allFiles) {
        classifyAndAddFile(file, builder, gbrJobData, smartMapping);
    }

    // Pass 3: Extract nested ZIPs if needed
    tryExtractNestedZips(allFiles, builder, nestingDepth);
}
```

### Classification Priority

```java
private static void classifyAndAddFile(Path file, Builder builder,
                                       Optional<GbrJobFile> gbrJobData,
                                       Map<String, LayerType> smartMapping) {
    String filename = file.getFileName().toString();

    // Priority: smart mapping > .gbrjob > filename detection
    LayerType type = Optional.ofNullable(smartMapping.get(filename))
            .or(() -> gbrJobData.flatMap(job -> job.getLayerTypeForFile(filename)))
            .orElseGet(() -> FileTypeDetector.detectType(file));

    builder.addFile(type, file);
}
```

