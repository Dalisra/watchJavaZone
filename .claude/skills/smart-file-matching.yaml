## Common Issues

### Issue 1: No X2 Attributes

**Problem:** Legacy Gerber files without %TF attributes

**Solution:** Fallback to numeric pattern matching and comment parsing

### Issue 2: Ambiguous Patterns

**Problem:** Multiple files match the same numeric pattern

**Solution:** Match count limited to expected count from .gbrjob

### Issue 3: Mixed Naming Conventions

**Problem:** Some files use KiCad names, others use numeric

**Solution:** Smart matching only overrides unmatched files

## Best Practices

1. **Content analysis first** - Most reliable, checks actual file attributes
2. **Pattern matching second** - Handles files without X2 attributes
3. **Log all matches** - Help users understand what was detected
4. **Preserve .gbrjob info** - Still valuable for layer count, thickness, etc.
5. **Warn on mismatches** - Alert users when smart matching is needed
6. **Limit to Gerber files** - Don't analyze drill files, documentation, etc.

## Performance Considerations

- **Read first 100 lines only** - Attributes are in header
- **Skip binary files** - Check extension before content analysis
- **Cache detections** - Don't re-analyze same file multiple times
- **Parallel analysis** - Can analyze files concurrently (future optimization)

