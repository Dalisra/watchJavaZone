# SDD Skill Template (Workshop Edition)
#
# Instructions:
# 1. Replace everything in [brackets]
# 2. The 3 required sections are: "When to Use This", "Quick Start", "Related Skills"
# 3. Keep it focused — one pattern, one skill
# 4. Test it: ask Claude to do the thing your skill describes. Did it work?
# 5. Start with status: draft. Promote to beta when it works. Production-ready after 2 weeks of use.
#
# Location guide:
#   This file: .claude/skills/  (project-specific)
#   Universal patterns: ~/.claude/skills/common/  (after 2+ projects need it)

