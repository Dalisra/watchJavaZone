## Surface Finishes (Classes 73, 76)

### FinishDef Model

Defines PCB surface finish specifications.

**Fields:**
- `objectId` (int) - Unique identifier
- `name` (String) - Finish name (e.g., "ENIG")
- `finishType` (FinishType enum) - Type of finish
- `thickness` (int) - Thickness in nanometers
- `description` (String) - Additional specifications

**FinishType Enum (12 types):**
```java
ENIG            // Electroless Nickel Immersion Gold
ENEPIG          // + Palladium layer (better for wire bonding)
HASL            // Hot Air Solder Leveling (leaded, NOT RoHS)
HASL_LEAD_FREE  // RoHS compliant HASL
OSP             // Organic Solderability Preservative
IMMERSION_SILVER
IMMERSION_TIN
HARD_GOLD       // For edge connectors (high wear)
SOFT_GOLD       // For wire bonding
BARE_COPPER
CARBON          // Carbon contact finish
OTHER
```

**Finish Properties:**

*Flat Surface Types (good for fine-pitch components):*
- ENIG, ENEPIG, OSP, IMMERSION_SILVER, IMMERSION_TIN, HARD_GOLD, SOFT_GOLD

*Non-Flat Surface Types:*
- HASL, HASL_LEAD_FREE (bumpy surface)

*RoHS Compliant:*
- All except HASL (contains lead)

**Usage Example:**
```java
// Create finish specification
FinishDef finish = new FinishDef(
    3001,
    "ENIG",
    FinishDef.FinishType.ENIG,
    100,  // 100nm = 0.1µm gold thickness
    "Electroless Nickel Immersion Gold: 5µm Ni + 0.1µm Au"
);

// Thickness conversion
double micrometers = finish.getThicknessInMicrometers();  // 0.1
boolean hasThickness = finish.hasThickness();  // true

// Properties
boolean flat = finish.finishType().isFlatSurface();  // true
boolean rohs = finish.finishType().isRoHSCompliant();  // true

// Display name
String display = finish.finishType().getDisplayName();
// "ENIG (Electroless Nickel Immersion Gold)"
```

### FinishDefList Container

Stores finish specifications with filtering.

**Query Methods:**
```java
FinishDefList finishes = new FinishDefList();
finishes.addFinish(finish1);
finishes.addFinish(finish2);

// Get primary (first) finish
FinishDef primary = finishes.getPrimaryFinish();

// Query by type (returns first match)
FinishDef enig = finishes.getFinishByType(FinishDef.FinishType.ENIG);

// Query by properties
List<FinishDef> flatFinishes = finishes.getFlatSurfaceFinishes();
List<FinishDef> rohsFinishes = finishes.getRoHSCompliantFinishes();
List<FinishDef> withThickness = finishes.getFinishesWithThickness();

// Property checks
boolean hasFlatFinish = finishes.hasFlatSurfaceFinish();
boolean allRoHS = finishes.isAllRoHSCompliant();

// Count
int total = finishes.getFinishCount();
```

### Binary Format (Class 73)

```
[OBJECT_ID:int32]    // Object ID
[NAME:string]        // Finish name
[FINISH_TYPE:int8]   // Type of finish (enum ordinal)
[THICKNESS:int32]    // Finish thickness in nanometers
[DESCRIPTION:string] // Additional specifications
```

**List Format (Class 76):**
```
[COUNT:int32]        // Number of finishes
[FINISHES...]        // FinishDef objects (each preceded by class ID 73)
```

## PCBDesign Integration

### Builder Pattern

```java
// Create manufacturing specifications
RuleDefList rules = new RuleDefList();
rules.addRule(new RuleDef(
    2001, "Min Trace Width", RuleDef.RuleType.MIN_TRACE_WIDTH,
    100_000, RuleDef.RuleSeverity.ERROR,
    "Minimum trace width per IPC Class 2"
));
rules.addRule(new RuleDef(
    2002, "Min Annular Ring", RuleDef.RuleType.MIN_VIA_ANNULAR_RING,
    50_000, RuleDef.RuleSeverity.ERROR,
    "Minimum annular ring per IPC Class 2"
));

FinishDefList finishes = new FinishDefList();
finishes.addFinish(new FinishDef(
    3001, "ENIG", FinishDef.FinishType.ENIG, 100,
    "5µm Ni + 0.1µm Au"
));

ChangeDefList changes = new ChangeDefList();
changes.addChange(ChangeDef.now(
    1001, "ECO-001", "Increased trace width",
    "AutoFix", "DRC violation",
    ChangeDef.ChangeType.MANUFACTURING_FIX,
    List.of(5001, 5002)
));

// Build PCB design with all specifications
PCBDesign design = PCBDesign.builder()
    .objectId(1)
    .name("ProductionBoard")
    .mifVersion(8)
    .manufacturingRules(rules)
    .surfaceFinishes(finishes)
    .changeHistory(changes)
    .addLayer(layer1)
    .addLayer(layer2)
    .build();

// Access specifications
RuleDefList designRules = design.getManufacturingRules();
FinishDefList designFinishes = design.getSurfaceFinishes();
ChangeDefList designChanges = design.getChangeHistory();
```

## Parsing & Writing

### Reading from MIF

```java
// Parse MIF file
PCBDesign design = MifParser.parse(mifFilePath);

// Access change tracking
ChangeDefList changes = design.getChangeHistory();
if (changes.getChangeCount() > 0) {
    ChangeDef latest = changes.getLatestChange();
    System.out.printf("Latest change: %s by %s%n",
        latest.name(), latest.author());
}

// Access manufacturing rules
RuleDefList rules = design.getManufacturingRules();
RuleDef traceWidth = rules.getRuleByType(RuleDef.RuleType.MIN_TRACE_WIDTH);
if (traceWidth != null) {
    System.out.printf("Min trace width: %.1fµm (%s)%n",
        traceWidth.getValueInMicrometers(),
        traceWidth.severity().getDisplayName());
}

// Access surface finishes
FinishDefList finishes = design.getSurfaceFinishes();
FinishDef primary = finishes.getPrimaryFinish();
if (primary != null) {
    System.out.printf("Surface finish: %s (flat=%b, RoHS=%b)%n",
        primary.name(),
        primary.finishType().isFlatSurface(),
        primary.finishType().isRoHSCompliant());
}
```

### Writing to MIF

```java
// Write to MIF file
Path outputPath = Paths.get("design-with-changes.mif");
MifWriter.write(design, outputPath);

// All manufacturing rules, finishes, and change history
// are automatically serialized to MIF binary format
```

## Auto-Fix Integration

### Recording Changes

```java
public class AutoFixEngine {

    public void fixTraceWidth(PCBDesign design, Feature feature) {
        // Get current change history
        ChangeDefList changes = design.getChangeHistory();

        // Perform fix
        double oldWidth = feature.getWidth();
        feature.setWidth(100_000);  // Fix to 100µm

        // Record change
        ChangeDef change = ChangeDef.now(
            changes.getChangeCount() + 1,
            String.format("AutoFix-%03d", changes.getChangeCount() + 1),
            String.format("Increased trace width from %.1fµm to 100µm",
                oldWidth / 1000.0),
            "lib-pcb AutoFix v0.14.0",
            "DRC violation: trace width below minimum 100µm",
            ChangeDef.ChangeType.MANUFACTURING_FIX,
            List.of(feature.getObjectId())
        );

        changes.addChange(change);
    }

    public void fixAnnularRing(PCBDesign design, PadFeature pad) {
        ChangeDefList changes = design.getChangeHistory();

        // Perform fix
        // ... modify pad annular ring ...

        // Record change
        ChangeDef change = ChangeDef.now(
            changes.getChangeCount() + 1,
            String.format("AutoFix-%03d", changes.getChangeCount() + 1),
            String.format("Increased annular ring for via at (%.1fmm, %.1fmm)",
                pad.getLocation().x() / 1_000_000.0,
                pad.getLocation().y() / 1_000_000.0),
            "lib-pcb AutoFix v0.14.0",
            "IPC Class 2 violation: annular ring below minimum 50µm",
            ChangeDef.ChangeType.COMPLIANCE_FIX,
            List.of(pad.getObjectId())
        );

        changes.addChange(change);
    }
}
```

### Querying Changes

```java
// Get all auto-fix changes
List<ChangeDef> autoFixes = design.getChangeHistory()
    .getChangesByAuthor("lib-pcb AutoFix v0.14.0");

System.out.printf("Auto-fix made %d changes:%n", autoFixes.size());
for (ChangeDef change : autoFixes) {
    System.out.printf("  [%s] %s%n", change.name(), change.description());
}

// Get changes by type
