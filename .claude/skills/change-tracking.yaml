### IPC Class 2 Rules

```java
RuleDefList ipcClass2Rules() {
    RuleDefList rules = new RuleDefList();

    // Trace rules
    rules.addRule(new RuleDef(
        2001, "Min Trace Width", RuleDef.RuleType.MIN_TRACE_WIDTH,
        100_000, RuleDef.RuleSeverity.ERROR,
        "IPC-6012 Class 2: Min trace width 100µm (4mil)"
    ));

    rules.addRule(new RuleDef(
        2002, "Min Trace Spacing", RuleDef.RuleType.MIN_TRACE_SPACING,
        100_000, RuleDef.RuleSeverity.ERROR,
        "IPC-6012 Class 2: Min trace spacing 100µm (4mil)"
    ));

    // Via rules
    rules.addRule(new RuleDef(
        2003, "Min Via Annular Ring", RuleDef.RuleType.MIN_VIA_ANNULAR_RING,
        50_000, RuleDef.RuleSeverity.ERROR,
        "IPC-6012 Class 2: Min annular ring 50µm (2mil)"
    ));

    // Clearance rules
    rules.addRule(new RuleDef(
        2004, "Min Copper to Edge", RuleDef.RuleType.MIN_COPPER_TO_EDGE,
        500_000, RuleDef.RuleSeverity.WARNING,
        "IPC-6012 Class 2: Min copper to edge 500µm (20mil)"
    ));

    return rules;
}
```

### IPC Class 3 Rules (Stricter)

```java
RuleDefList ipcClass3Rules() {
    RuleDefList rules = new RuleDefList();

    // 25% stricter trace width
    rules.addRule(new RuleDef(
        2001, "Min Trace Width", RuleDef.RuleType.MIN_TRACE_WIDTH,
        125_000, RuleDef.RuleSeverity.ERROR,
        "IPC-6012 Class 3: Min trace width 125µm (5mil)"
    ));

    // 50% stricter annular ring
    rules.addRule(new RuleDef(
        2003, "Min Via Annular Ring", RuleDef.RuleType.MIN_VIA_ANNULAR_RING,
        75_000, RuleDef.RuleSeverity.ERROR,
        "IPC-6012 Class 3: Min annular ring 75µm (3mil)"
    ));

    // 2x stricter copper to edge
    rules.addRule(new RuleDef(
        2004, "Min Copper to Edge", RuleDef.RuleType.MIN_COPPER_TO_EDGE,
        1_000_000, RuleDef.RuleSeverity.ERROR,
        "IPC-6012 Class 3: Min copper to edge 1mm (40mil)"
    ));

    return rules;
}
```

### Common Surface Finishes

```java
FinishDefList commonFinishes() {
    FinishDefList finishes = new FinishDefList();

    // ENIG - most common for fine-pitch
    finishes.addFinish(new FinishDef(
        3001, "ENIG", FinishDef.FinishType.ENIG, 100,
        "Electroless Nickel Immersion Gold: 5µm Ni + 0.1µm Au"
    ));

    // HASL Lead-Free - cost-effective
    finishes.addFinish(new FinishDef(
        3002, "HASL Lead-Free", FinishDef.FinishType.HASL_LEAD_FREE, 1000,
        "RoHS compliant, good solderability, not flat"
    ));

    // OSP - budget option
    finishes.addFinish(new FinishDef(
        3003, "OSP", FinishDef.FinishType.OSP, 0,
        "Organic Solderability Preservative, limited shelf life"
    ));

    // Immersion Silver - flat, good for RF
    finishes.addFinish(new FinishDef(
        3004, "Immersion Silver", FinishDef.FinishType.IMMERSION_SILVER, 200,
        "Flat surface, good for RF applications"
    ));

    return finishes;
}
```

