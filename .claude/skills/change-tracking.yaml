# MIF Change Tracking & Manufacturing Specifications

## When to Use This

Use this skill when:

- **Change tracking**: Recording auto-fix changes with ChangeDef
- **Manufacturing rules**: Defining RuleDef constraints
- **Surface finishes**: Specifying FinishDef (ENIG, HASL, OSP)
- **MIF Classes 72-77**: Understanding change/rule/finish data models
- **Audit trail**: Querying design change history

You're in the right place if:
- You're implementing auto-fix change tracking
- You need to record design changes (ECOs)
- You're defining manufacturing rules
- You want to specify surface finishes
- You're querying change history
- You need to understand ChangeDef/RuleDef/FinishDef models

## Overview

MIF Classes 72-77 provide comprehensive change tracking, manufacturing rules, and surface finish specifications. This system enables:

- **Change Tracking** - Audit trail for design modifications (ECOs, bug fixes, compliance updates)
- **Manufacturing Rules** - Design constraints (trace width, annular ring, clearances)
- **Surface Finishes** - PCB finish specifications (ENIG, HASL, OSP, etc.)

## MIF Class Definitions

| Class | Name | Purpose | Container |
|-------|------|---------|-----------|
| 72 | CTMifRuleDef | Manufacturing rule definition | Single rule |
| 73 | CTMifFinishDef | Surface finish definition | Single finish |
| 74 | CTMifChangeDef | Design change/ECO record | Single change |
| 75 | CTMifRuleDefList | Rule list container | Multiple rules |
| 76 | CTMifFinishDefList | Finish list container | Multiple finishes |
| 77 | CTMifChangeDefList | Change history container | Multiple changes |

## Change Tracking (Classes 74, 77)

### ChangeDef Model

Records a single design change with full audit trail.

**Fields:**
- `objectId` (int) - Unique identifier
- `name` (String) - Change identifier (e.g., "ECO-001")
- `description` (String) - What changed
- `timestamp` (long) - Unix epoch milliseconds
- `author` (String) - Who made the change
- `reason` (String) - Why the change was made
- `changeType` (ChangeType enum) - Type of change
- `affectedObjectIds` (List<Integer>) - Affected objects

**ChangeType Enum (17 types):**

*Design Changes:*
```java
DESIGN_REVISION         // Design revision (e.g., Rev A → Rev B)
ECO                     // Engineering Change Order
CUSTOMER_REQUEST        // Customer-requested change
```

*Quality & Compliance:*
```java
MANUFACTURING_FIX       // Manufacturing fix based on supplier feedback
QUALITY_IMPROVEMENT     // Quality improvement
COMPLIANCE_FIX          // IPC/regulatory compliance fix
COST_REDUCTION          // Cost reduction optimization
PERFORMANCE_IMPROVEMENT // Performance improvement
BUG_FIX                 // Bug fix
```

*Smart Decision Tracking (NEW in 0.80.7):*
```java
FILE_MATCHING_RECOVERY     // Smart file matching when .gbrjob mismatches
PACKAGE_EXTRACTION         // Nested ZIP extraction
NUMERIC_PATTERN_DETECTION  // Numeric pattern matching (-02.gbr, -20.gbr)
EXTENSION_PATTERN_DETECTION // Manufacturer naming conventions
CONTENT_DETECTION          // Gerber X2 / G04 comment-based detection
LEGACY_FORMAT_CONVERSION   // RS-274D format conversion (reserved)
```

*Other:*
```java
DOCUMENTATION           // Documentation update
OTHER                   // Other change type
```

**Usage Example:**
```java
// Create change record with current timestamp
ChangeDef change = ChangeDef.now(
    1001,
    "ECO-001",
    "Increased trace width from 50µm to 100µm on layer 2200",
    "lib-pcb AutoFix v0.14.0",
    "DRC violation: trace width below minimum",
    ChangeDef.ChangeType.MANUFACTURING_FIX,
    List.of(5001, 5002, 5003)  // Affected feature IDs
);

// Access helpers
Instant when = change.getTimestampAsInstant();
boolean hasObjects = change.hasAffectedObjects();
int count = change.getAffectedObjectCount();
```

### ChangeDefList Container

Stores change history with rich query capabilities.

**Query Methods:**
```java
ChangeDefList changes = new ChangeDefList();
changes.addChange(change1);
changes.addChange(change2);

// Query by type
List<ChangeDef> mfgFixes = changes.getChangesByType(
    ChangeDef.ChangeType.MANUFACTURING_FIX
);

// Query by author
List<ChangeDef> autoFixChanges = changes.getChangesByAuthor(
    "lib-pcb AutoFix v0.14.0"
);

// Query by affected objects
List<ChangeDef> affecting5001 = changes.getChangesAffecting(5001);

// Query by time range
long oneHourAgo = Instant.now().minusSeconds(3600).toEpochMilli();
long now = Instant.now().toEpochMilli();
List<ChangeDef> recentChanges = changes.getChangesInRange(oneHourAgo, now);

// Get latest/oldest
ChangeDef latest = changes.getLatestChange();
ChangeDef oldest = changes.getOldestChange();

// Counts
int total = changes.getChangeCount();
```

### Binary Format (Class 74)

```
[OBJECT_ID:int32]    // Object ID
[NAME:string]        // Change identifier (e.g., "ECO-001")
[DESCRIPTION:string] // What changed
[TIMESTAMP:int64]    // When (Unix epoch milliseconds)
[AUTHOR:string]      // Who made the change
[REASON:string]      // Why the change was made
[CHANGE_TYPE:int8]   // Type of change (enum ordinal)
[COUNT:int32]        // Number of affected objects
[OBJECT_IDS...]      // Affected object IDs (int32 each)
```

**List Format (Class 77):**
```
[COUNT:int32]        // Number of change records
[CHANGES...]         // ChangeDef objects (each preceded by class ID 74)
```

## Manufacturing Rules (Classes 72, 75)

### RuleDef Model

Defines manufacturing design constraints.

**Fields:**
- `objectId` (int) - Unique identifier
- `name` (String) - Rule name (e.g., "Min Trace Width")
- `ruleType` (RuleType enum) - Type of rule
- `value` (int) - Rule value in nanometers
- `severity` (RuleSeverity enum) - Severity level
- `description` (String) - Description

**RuleType Enum (25 types):**

*Trace Rules:*
- `MIN_TRACE_WIDTH` - Minimum trace width
- `MAX_TRACE_WIDTH` - Maximum trace width
- `MIN_TRACE_SPACING` - Minimum trace spacing
- `MIN_TRACE_TO_PAD_CLEARANCE` - Minimum trace to pad clearance

*Via Rules:*
- `MIN_VIA_ANNULAR_RING` - Minimum via annular ring
- `MIN_VIA_SPACING` - Minimum via spacing
- `MIN_VIA_TO_TRACE_SPACING` - Minimum via to trace spacing

*Drill Rules:*
- `MIN_DRILL_DIAMETER` - Minimum drill diameter
- `MAX_DRILL_DIAMETER` - Maximum drill diameter
- `MIN_HOLE_SPACING` - Minimum hole spacing
- `MAX_DRILL_ASPECT_RATIO` - Maximum drill aspect ratio

*Pad Rules:*
- `MIN_PAD_DIAMETER` - Minimum pad diameter
- `MIN_PAD_CLEARANCE` - Minimum pad clearance

*Clearance Rules:*
- `MIN_COPPER_TO_EDGE` - Minimum copper to board edge
- `MIN_COPPER_CLEARANCE` - Minimum copper clearance
- `MIN_SOLDER_MASK_CLEARANCE` - Minimum solder mask clearance

*Solder Mask Rules:*
- `SOLDER_MASK_EXPANSION` - Solder mask expansion
- `MIN_SOLDER_MASK_BRIDGE` - Minimum solder mask bridge

*Board Rules:*
- `MIN_BOARD_DIMENSION` - Minimum board dimension
- `MAX_BOARD_DIMENSION` - Maximum board dimension
- `MIN_BOARD_THICKNESS` - Minimum board thickness
- `MAX_BOARD_THICKNESS` - Maximum board thickness

*Silkscreen Rules:*
- `MIN_SILKSCREEN_WIDTH` - Minimum silkscreen width
- `MIN_SILKSCREEN_TEXT_HEIGHT` - Minimum silkscreen text height

*Other:*
- `CUSTOM` - Custom rule type

**RuleSeverity Enum (4 levels):**
```java
INFO     // Informational only
WARNING  // May impact manufacturability
ERROR    // Will likely cause manufacturing issues
CRITICAL // Prevents manufacturing
```

**Usage Example:**
```java
// Create manufacturing rule
RuleDef rule = new RuleDef(
    2001,
    "Min Trace Width",
    RuleDef.RuleType.MIN_TRACE_WIDTH,
    100_000,  // 100µm in nanometers
    RuleDef.RuleSeverity.ERROR,
    "Minimum trace width for standard manufacturing"
);

// Value conversions
double micrometers = rule.getValueInMicrometers();  // 100.0
double millimeters = rule.getValueInMillimeters();  // 0.1

// Display name
String display = rule.ruleType().getDisplayName();  // "Minimum Trace Width"
```

### RuleDefList Container

Stores manufacturing rules with filtering.

**Query Methods:**
```java
RuleDefList rules = new RuleDefList();
rules.addRule(rule1);
rules.addRule(rule2);

// Query by type (returns first match)
RuleDef traceWidth = rules.getRuleByType(RuleDef.RuleType.MIN_TRACE_WIDTH);

// Query by severity
List<RuleDef> criticalRules = rules.getCriticalRules();
List<RuleDef> errorRules = rules.getErrorRules();
List<RuleDef> warningRules = rules.getWarningRules();
List<RuleDef> bySeverity = rules.getRulesBySeverity(RuleDef.RuleSeverity.ERROR);

// Query by value ranges
List<RuleDef> below100um = rules.getRulesBelowValue(100_000);
List<RuleDef> above500um = rules.getRulesAboveValue(500_000);

// Count
int total = rules.getRuleCount();
```

### Binary Format (Class 72)

```
[OBJECT_ID:int32]    // Object ID
[NAME:string]        // Rule name
[RULE_TYPE:int8]     // Type of rule (enum ordinal)
[VALUE:int32]        // Rule value in nanometers
[SEVERITY:int8]      // Rule severity (enum ordinal)
