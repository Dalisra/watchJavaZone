List<ChangeDef> affecting = design.getChangeHistory()
    .getChangesAffecting(featureId);

if (!affecting.isEmpty()) {
    System.out.printf("Feature %d was modified by %d changes:%n",
        featureId, affecting.size());
    for (ChangeDef change : affecting) {
        System.out.printf("  %s: %s%n", change.name(), change.reason());
    }
}
```

## Smart Decision Tracking (NEW in 0.80.7)

### Overview

Smart decision tracking records automatic "smart" decisions made during package scanning and conversion. This provides manufacturing traceability for heuristics and recovery strategies.

**5 Smart Decisions Tracked:**
1. **Smart file matching** - When .gbrjob filenames don't match actual files
2. **Nested ZIP extraction** - Automatic extraction to find Gerber files
3. **Content-based detection** - Gerber X2 / G04 comment layer detection
4. **Numeric pattern matching** - Layer detection from patterns (-02.gbr)
5. **Extension pattern detection** - Manufacturer naming conventions

### Architecture Pattern

**Collector → Pass Through → Convert:**

```
PackageReader.scan()
    ↓
PackageScanDecisions (collector)
    ↓
PackageContents (pass through)
    ↓
GerberToMifConverter
    ↓
ChangeDef entries in ChangeDefList
```

**Key Principle:** Collect decisions during scanning, convert to ChangeDef during MIF generation.

### PackageScanDecisions Collector

Lightweight metadata collector for scan-time decisions.

```java
public class PackageScanDecisions {
    private final List<DecisionRecord> decisions = new ArrayList<>();

    // Recording methods
    public void recordSmartFileMatching(int matchCount, int totalExpected, String reason);
    public void recordNestedZipExtraction(String zipName, int fileCount, String reason);
    public void recordContentDetection(int fileCount, String examples, String markers);
    public void recordNumericPatternMatching(int fileCount, String patterns, String reason);
    public void recordExtensionPatternDetection(int fileCount, String convention, String examples);

    // Access
    public List<DecisionRecord> getDecisions();
    public boolean hasDecisions();
    public int getDecisionCount();

    public record DecisionRecord(
        DecisionType type,
        String description,
        String reason,
        Map<String, String> details
    ) {}

    public enum DecisionType {
        FILE_MATCHING_RECOVERY,
        PACKAGE_EXTRACTION,
        NUMERIC_PATTERN_DETECTION,
        EXTENSION_PATTERN_DETECTION,
        CONTENT_DETECTION,
        LEGACY_FORMAT_CONVERSION
    }
}
```

### Integration with PackageContents

**Step 1: Add to Builder**

```java
public class PackageContents {
    private final PackageScanDecisions scanDecisions;

    public static class Builder {
        private final PackageScanDecisions scanDecisions = new PackageScanDecisions();

        public PackageScanDecisions scanDecisions() {
            return scanDecisions;
        }
    }

    public PackageScanDecisions getScanDecisions() {
        return scanDecisions;
    }
}
```

**Step 2: Record Decisions**

```java
// In PackageReader.java
private static Map<String, LayerType> trySmartFileMatching(..., Builder builder) {
    // ... smart matching logic ...

    if (!smartMapping.isEmpty()) {
        int mismatchPct = (int) ((gbrJobMappings.size() - matchCount) * 100.0
                                 / gbrJobMappings.size());
        String reason = String.format(
            "%d%% of .gbrjob filenames didn't match; applied intelligent matching",
            mismatchPct);

        builder.scanDecisions().recordSmartFileMatching(
            smartMapping.size(),
            gbrJobMappings.size(),
            reason
        );
    }

    return smartMapping;
}
```

### Conversion to ChangeDef

**In GerberToMifConverter.java:**

```java
private ChangeDefList createChangeHistory(
        PackageContents packageContents,
        boolean hasDrillListings,
        boolean hasPnPFiles) {

    ChangeDefList changeHistory = new ChangeDefList();
    int objectId = 1000;

    // Smart decisions FIRST (chronological order)
    objectId = addSmartDecisions(changeHistory, objectId,
        packageContents.getScanDecisions());

    // Then coordinate corrections
    objectId = addCoordinateCorrections(changeHistory, objectId, ...);

    return changeHistory;
}

private int addSmartDecisions(ChangeDefList history, int startId,
                              PackageScanDecisions scanDecisions) {
    int objectId = startId;

    for (DecisionRecord decision : scanDecisions.getDecisions()) {
        ChangeDef.ChangeType changeType = mapDecisionTypeToChangeType(decision.type());

        ChangeDef change = ChangeDef.now(
            objectId++,
            getChangeDefName(decision.type()),
            decision.description(),
            "lib-pcb Package Scanner v0.80.7",
            decision.reason(),
            changeType,
            List.of()  // No affected objects for scan decisions
        );

        history.addChange(change);
    }

    return objectId;
}

private ChangeDef.ChangeType mapDecisionTypeToChangeType(DecisionType type) {
    return switch (type) {
        case FILE_MATCHING_RECOVERY -> ChangeDef.ChangeType.FILE_MATCHING_RECOVERY;
        case PACKAGE_EXTRACTION -> ChangeDef.ChangeType.PACKAGE_EXTRACTION;
        case NUMERIC_PATTERN_DETECTION -> ChangeDef.ChangeType.NUMERIC_PATTERN_DETECTION;
        case EXTENSION_PATTERN_DETECTION -> ChangeDef.ChangeType.EXTENSION_PATTERN_DETECTION;
        case CONTENT_DETECTION -> ChangeDef.ChangeType.CONTENT_DETECTION;
        case LEGACY_FORMAT_CONVERSION -> ChangeDef.ChangeType.LEGACY_FORMAT_CONVERSION;
    };
}
```

### Detection Priority Hierarchy

Smart matching uses prioritized fallback:

1. **Content detection** (Gerber X2 / G04) → MOST RELIABLE
2. **Numeric patterns** (-02.gbr, -20.gbr) → FALLBACK
3. **Extension patterns** (German PCB, KiCad) → FALLBACK

Each method tracked separately in ChangeDefList.

### Real-World Example

**LP-Date12.2025.zip change history:**

```java
// Scan decision (first)
ChangeDef extensionPattern = ChangeDef.now(
    1000,
    "Extension-Pattern-Detection",
    "Detected 13 files using German PCB naming convention",
    "lib-pcb Package Scanner v0.80.7",
    "Package uses manufacturer-specific naming patterns; applied German PCB " +
    "convention rules (examples: adb006030.gbr, adt001027.gbr, bs.gbr)",
    ChangeDef.ChangeType.EXTENSION_PATTERN_DETECTION,
    List.of()
);

// Conversion decision (second, chronologically later)
ChangeDef formatDetection = ChangeDef.now(
    1001,
    "Gerber-Format-AutoDetect",
    "Auto-detected RS-274D coordinate format (X2.5)",
    "lib-pcb Gerber Converter v0.80.7",
    "RS-274D files lack format headers; analyzed coordinates",
    ChangeDef.ChangeType.MANUFACTURING_FIX,
    List.of()
);
```

### Chronological Ordering

**Critical:** Smart decisions appear BEFORE coordinate corrections:

```
objectId: 1000 → Extension-Pattern-Detection (scan-time)
objectId: 1001 → Gerber-Format-AutoDetect (parse-time)
objectId: 1002 → Drill-Coordinate-Scaling (parse-time)
objectId: 1003 → Assembly-Coordinate-Scaling (parse-time)
```

**Reason:** Decisions are recorded in chronological order (scanning happens before parsing/conversion).

### Testing Pattern

**Integration test verifies end-to-end tracking:**

```java
@Test
void shouldTrackScanDecisionsInChangeHistory() throws Exception {
    try (PackageContents pkg = PackageReader.scan(
            Paths.get("src/test/resources/gerber/LP-Date12.2025.zip"))) {

        // Verify scan decisions collected
        assertNotNull(pkg.getScanDecisions());
        assertTrue(pkg.getScanDecisions().hasDecisions());

        // Convert to MIF
        GerberToMifConverter converter = new GerberToMifConverter();
        PCBDesign design = converter.convertPackage(pkg);

        // Verify ChangeDef entries created
        ChangeDefList history = design.getChangeHistory();
        List<ChangeDef> smartDecisions = history.getChanges().stream()
            .filter(c -> c.changeType() == ChangeDef.ChangeType.FILE_MATCHING_RECOVERY ||
                        c.changeType() == ChangeDef.ChangeType.PACKAGE_EXTRACTION ||
                        c.changeType() == ChangeDef.ChangeType.NUMERIC_PATTERN_DETECTION ||
                        c.changeType() == ChangeDef.ChangeType.EXTENSION_PATTERN_DETECTION ||
                        c.changeType() == ChangeDef.ChangeType.CONTENT_DETECTION)
            .toList();

        assertEquals(pkg.getScanDecisions().getDecisionCount(), smartDecisions.size(),
            "Decision count should match ChangeDef entries");
    }
}
```

### Backward Compatibility

**Zero risk:** Empty decisions → no ChangeDef entries.

```java
// Package with no smart decisions needed
PackageScanDecisions decisions = new PackageScanDecisions();
assertFalse(decisions.hasDecisions());

// Converter handles gracefully
ChangeDefList history = createChangeHistory(packageContents, ...);
// history contains only coordinate corrections, no smart decisions
```

### Manufacturing Impact

**Complete audit trail:**
