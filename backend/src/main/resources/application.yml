micronaut:
  application:
    name: backend
  http:
    client:
      read-timeout: 300s

datasources:
  default:
    url: ${JDBC_DATABASE_URL:`jdbc:postgresql://localhost:5432/postgres?currentSchema=watch`}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration
      create-schemas: true
      default-schema: watch
      schemas: watch

google:
  api:
    key: ${GOOGLE_API_KEY:}

gemini:
  model: gemini-2.5-flash
